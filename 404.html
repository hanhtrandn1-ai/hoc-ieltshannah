<title>Đang chuyển hướng… – IELTS Hannah</title>
<script>
(function(){
  var p = location.pathname || '/';
  var q = location.search || '';
  var h = location.hash || '';
  if (p.indexOf('/baitap') === 0 || /baitap/i.test(p)) {
    location.replace('/baitap/' + q + h);
  } else if (p.indexOf('/60ngay') === 0) {
    location.replace('/60ngay/' + q + h);
  } else {
    location.replace('/baitap/' + q + h);
  }
})();
</script>
</head>
