<title>60 ngày luyện nghĩ & phản xạ tiếng Anh – IELTS Hannah</title>

<style>
/* Layout: one narrow working column for students; a wider grid for the teacher dashboard. Ink teal + mustard highlighter. */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --line:#D3DDDA;
  --ink:#14302F; --muted:#5A6E6C; --accent:#0F5E5A; --accent-ink:#FFFFFF;
  --mark:#F2C14E; --mark-soft:#FBEBC2; --ok:#1E7A46; --ok-soft:#DDF1E4; --bad:#B23A2E; --bad-soft:#F8E0DC;
  --gold:#C9971C; --silver:#8C9AA0; --bronze:#A8673A; --pic:#FFFFFF;
  --display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A1A; --surface:#172625; --surface-2:#1F3231; --line:#2C4442;
  --ink:#E4EEEC; --muted:#9DB2AF; --accent:#4FB8AE; --accent-ink:#0B1716;
  --mark:#E9B93F; --mark-soft:#3A3220; --ok:#5CCB8A; --ok-soft:#173326; --bad:#F08A7E; --bad-soft:#3A1F1C;
  --gold:#E2B640; --silver:#A9B7BC; --bronze:#C98B5C; --pic:#F4F4F0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A1A; --surface:#172625; --surface-2:#1F3231; --line:#2C4442;
  --ink:#E4EEEC; --muted:#9DB2AF; --accent:#4FB8AE; --accent-ink:#0B1716;
  --mark:#E9B93F; --mark-soft:#3A3220; --ok:#5CCB8A; --ok-soft:#173326; --bad:#F08A7E; --bad-soft:#3A1F1C;
  --gold:#E2B640; --silver:#A9B7BC; --bronze:#C98B5C; --pic:#F4F4F0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.55;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}

h1{font-size:1.75rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.wrap.wide{max-width:1120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top > *{min-width:0}

.logo{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem}
.brand small{display:block;color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}

.small{font-size:.875rem}

.field input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:1rem}

.err{color:var(--bad);font-size:.9rem;font-weight:500}

.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-size:.8rem;font-weight:600;color:var(--muted)}

.lesson .num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:.85rem;letter-spacing:.05em}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}

.item{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}

.vi{font-weight:600}
.en{margin-top:4px;line-height:2.4}
.gap{display:inline-block;border:0;border-bottom:2px solid var(--accent);background:var(--mark-soft);border-radius:6px 6px 0 0;padding:2px 6px;min-width:4ch;text-align:center;font-weight:600;font-size:1rem}
.gap:focus{outline:none;background:var(--mark);color:#14302F}
.hint{color:var(--muted);font-size:.8rem;margin-left:2px;letter-spacing:.08em;font-family:ui-monospace,Menlo,monospace}
.wordbox{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:10px}
.wordbox span{padding:4px 10px;border-radius:8px;background:var(--surface-2);font-weight:600;font-size:.9rem}
.linkword{font-family:var(--display);font-weight:600;color:var(--accent)}
/* drag & drop pictures */
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border:1.5px dashed var(--line);border-radius:12px;min-height:56px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--surface)}
.word{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;padding:7px 12px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.95rem;border:0}
.word[aria-pressed="true"]{background:var(--mark);color:#14302F;box-shadow:0 0 0 3px var(--mark-soft)}
.bank .empty-note{color:var(--muted);font-size:.875rem;align-self:center}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.pic{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);cursor:pointer}
.pic.over{border-color:var(--mark);box-shadow:0 0 0 3px var(--mark-soft)}
.pic .img{background:var(--pic);aspect-ratio:4/3;display:grid;place-items:center;padding:6px;position:relative}
.pic .img img{max-height:100%;max-width:100%;object-fit:contain}
.pic .img .no{position:absolute;top:6px;left:6px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:.75rem;border-radius:6px;padding:1px 7px}
.pic .meta{padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.pic .vn{font-size:.85rem;color:var(--muted);font-weight:500}
.slot{min-height:38px;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.85rem;color:var(--muted)}
.slot .word{cursor:pointer}
.dragghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:translate(-50%,-60%)}
.q{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0}
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.04em;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.t{background:var(--mark-soft);color:var(--ink)}
textarea{width:100%;min-height:64px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);resize:vertical}
textarea:focus{border-color:var(--accent);outline:none}
.tip{font-size:.85rem;background:var(--surface-2);border-radius:10px;padding:10px 12px}
.navrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.big{font-family:var(--display);font-size:3.2rem;font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.big small{font-size:1.2rem;color:var(--muted)}
.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.p5dots{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}.p5dots span{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;background:var(--line,#e5e7eb);color:#555}
.p5dots span.cur{outline:2px solid var(--brand,#0f5c55);outline-offset:1px}.p5dots span.ok{background:#d6f5e3;color:#11683b}.p5dots span.mid{background:#fff1cc;color:#7a5600}.p5dots span.bad{background:#fde2df;color:#9b2a22}
.p5img{display:block;width:100%;max-width:420px;margin:0 auto 12px;border-radius:14px;border:1px solid var(--line,#e5e7eb);background:#fff}
.p5vi{font-size:1.15rem;font-weight:700;text-align:center;margin:6px 0 14px}
.p5rec{display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap}
.micbtn{width:76px;height:76px;border-radius:50%;border:0;font-size:32px;cursor:pointer;background:var(--brand,#0f5c55);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.15)}
.micbtn.on{background:#e8604c;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.07)}}
.p5fb{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f6f7f9}.p5fb.ok{background:#e6f7ee}.p5fb.bad{background:#fdecea}
.p5w{display:inline-block;margin:0 3px;font-weight:700}.p5w.ok{color:#11683b}.p5w.near{color:#b26b00}.p5w.no{color:#c0392b;text-decoration:underline wavy}
.p5ans{margin-top:8px;padding:10px 12px;border-radius:10px;background:#e8f1ff;color:#1d4f91;font-weight:700}
.part{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.part b{font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.fix{display:grid;grid-template-columns:1fr;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.fix:first-of-type{border-top:0}
.got{color:var(--bad);text-decoration:line-through}
.want{color:var(--ok);font-weight:600}
.fb{font-size:.875rem;display:flex;flex-direction:column;gap:2px}
.fb .y{color:var(--ok)} .fb .x{color:var(--bad)}
.filters{display:flex;gap:10px;flex-wrap:wrap}
.filters select{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi b{display:block;font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.2}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.pod{border-radius:12px;padding:12px 10px;text-align:center;background:var(--surface-2);display:flex;flex-direction:column;gap:2px;min-width:0}
.pod .medal{width:34px;height:34px;border-radius:50%;margin:0 auto 4px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff}
.pod .nm{font-weight:600;overflow-wrap:anywhere}
.pod.p1{padding-block:22px}.pod.p2{padding-block:16px}
.m1{background:var(--gold)}.m2{background:var(--silver)}.m3{background:var(--bronze)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--surface-2)}
.rank{font-family:var(--display);font-weight:700;width:2.2em}
.bar{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:10px;align-items:center;font-size:.9rem}
.bar .track{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:6px;display:block}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.miss{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.9rem}
.miss:first-of-type{border-top:0}
.miss .pct{font-weight:700;color:var(--bad);font-variant-numeric:tabular-nums}
.detail td{white-space:normal;background:var(--surface-2)}
.detail .box{display:flex;flex-direction:column;gap:6px;padding:6px 4px}
.toggle{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.toggle button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.empty{padding:20px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:60}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.parts{grid-template-columns:repeat(3,1fr)}.pics{grid-template-columns:repeat(2,minmax(0,1fr))}.podium{grid-template-columns:1fr}.pod.p1,.pod.p2{padding-block:12px}.bar{grid-template-columns:1fr auto}.bar .track{grid-column:1/-1;grid-row:2}h1{font-size:1.45rem}.steps button{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.inapp{position:sticky;top:0;z-index:50;background:#FFF4D6;border-bottom:2px solid #F2C14E;padding:10px 14px;font-size:14px}
</style>

<script>
/* =========================================================
   1. NỘI DUNG BÀI HỌC
   ex1: kéo thả từ vào hình — {w: từ, vi: nghĩa}; hình = IMAGES["<bài>_<số>"]
   ex2, ex3: ô trống {đáp án|gợi ý|nhóm lỗi}; nhiều đáp án: "/"; <First> = từ nối in đậm
   ex4: 4 câu hỏi, tense HTĐ / QKĐ

function gas(fn, ...args){
  if (IN_GAS) return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  return webCall(fn, args, 0);

async function webCall(fn, args, tries){
  let r;
  try{
    r = await fetch(API_URL, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify({fn: fn, args: args}), redirect: "follow"});
  }catch(e){
    if (tries < 2){ await new Promise(ok => setTimeout(ok, 1200 * (tries + 1))); return webCall(fn, args, tries + 1); }
    throw new Error("Mạng yếu hoặc mất kết nối. Em kiểm tra mạng rồi thử lại nhé.");
  }
  let j; try{ j = await r.json(); }catch(e){ throw new Error("Máy chủ đang bận, em thử lại sau vài giây nhé."); }
  if (j.error) throw new Error(j.error);
  return j.result;
}

function shuffle(a, seed){ a = a.slice(); let s = seed || 7; for (let i = a.length-1; i > 0; i--){ s = (s*9301+49297)%233280; const j = Math.floor(s/233280*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function parseTokens(text){
  const out = []; const re = /\{([^}]*)\}|<([^>]+)>/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push({t:"text", v:text.slice(last, m.index)});
    if (m[1] !== undefined){ const [ans, hint="", cat=""] = m[1].split("|"); out.push({t:"gap", ans:ans.split("/"), hint, cat}); }
    else out.push({t:"link", v:m[2]});
    last = re.lastIndex;
  }
  if (last < text.length) out.push({t:"text", v:text.slice(last)});
  return out;
}

function verbCat(ans, base){
  if (!base) return "vocab";
  if (base === "be") return "be";
  if (ans === base + "ed" || ans === base + "d") return "ed";
  if (/y$/.test(base) && ans === base.slice(0,-1) + "ied") return "ied";
  if (ans === base + base.slice(-1) + "ed") return "dbl";
  return "irr";
}

/* =========================================================
   5b. THUYẾT TRÌNH (BT5): nhìn tranh + câu tiếng Việt → bấm 🎙 nói câu tiếng Anh.
   AI nghe file ghi âm và chép lại lời em nói, so từng từ với câu mẫu.
   Dưới 50% → hiện đáp án + nghe mẫu, nói lại 1 lần. Từ 50% → sang câu tiếp.
   ========================================================= */
function speakEN(t){ try{ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.9; speechSynthesis.speak(u); }catch(e){} }
const P5_NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
const P5_CONTR = {"i'm":"i am","it's":"it is","that's":"that is","he's":"he is","she's":"she is","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","can't":"can not","cannot":"can not","won't":"will not","i'll":"i will","let's":"let us","what's":"what is","there's":"there is","they're":"they are","we're":"we are","you're":"you are"};
function p5Words(s){
  return String(s || "").toLowerCase().replace(/[’‘`]/g, "'").replace(/-/g, " ").replace(/[a-z]+'[a-z]+/g, w => P5_CONTR[w] || w)
    .replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean).map(w => P5_NUM[w] || w.replace(/^'+|'+$/g, "")).filter(Boolean)
    .map(w => ({colour:"color", ok:"okay", grey:"gray", mum:"mom"})[w] || w);
}
function p5Lev(a, b){ const d = []; for (let i = 0; i <= a.length; i++){ d.push([i]); for (let j = 1; j <= b.length; j++) d[i].push(i ? 0 : j); }
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[a.length][b.length]; }
function p5Sim(t, h){ if (t === h) return 2; t = t.replace(/'/g, ""); h = h.replace(/'/g, ""); if (t === h) return 2;
  const L = Math.max(t.length, h.length), d = p5Lev(t, h);
  if (L <= 3) return (d === 1 && Math.min(t.length, h.length) >= 2) ? 1 : 0;
  if (d / L <= 0.4) return 1; if (t.slice(0, 2) === h.slice(0, 2) && Math.abs(t.length - h.length) <= 1 && d / L <= 0.6) return 1; return 0; }
/** So câu mẫu với lời nghe được → {ratio 0..1, marks:[{w,s:'ok'|'near'|'no'}]} */
function p5Score(target, heard){
  const T = p5Words(target), H = p5Words(heard), n = T.length, m = H.length, L = [];
  for (let i = 0; i <= n; i++){ L.push(new Array(m + 1).fill(0)); }
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--){ const sm = p5Sim(T[i], H[j]); L[i][j] = Math.max(L[i+1][j], L[i][j+1], sm ? sm + L[i+1][j+1] : 0); }
  const st = {}; let i = 0, j = 0;
  while (i < n && j < m){ const sm = p5Sim(T[i], H[j]); if (sm && L[i][j] === sm + L[i+1][j+1]){ st[i] = sm; i++; j++; } else if (L[i+1][j] >= L[i][j+1]) i++; else j++; }
  let got = 0; Object.keys(st).forEach(k => got += st[k] === 2 ? 1 : 0.5);
  let ratio = n ? got / n : 0;
  if (m > n + 3) ratio *= 0.9; // nói thừa nhiều

  }
}

/* Kéo thả: chuột/cảm ứng bằng pointer events; chạm-để-chọn làm phương án dự phòng */
function placeWord(i, w){
  const L = LESSONS[S.lesson];
  L.ex1.forEach((_, j) => { if (S.answers["e1_"+j] === w) delete S.answers["e1_"+j]; });
  S.answers["e1_"+i] = w; S.picked = null; S.confirmBlank = false;
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function wireDrag(){
  document.querySelectorAll("#bank .word").forEach(chip => {
    chip.addEventListener("pointerdown", e => {
      if (e.button > 0) return;
      const w = chip.dataset.w, sx = e.clientX, sy = e.clientY; let ghost = null, over = null;
      chip.setPointerCapture(e.pointerId);
      const move = ev => {
        if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 6) return;
        if (!ghost){ ghost = chip.cloneNode(true); ghost.classList.add("dragghost"); document.body.appendChild(ghost); }
        ghost.style.left = ev.clientX + "px"; ghost.style.top = ev.clientY + "px";
        const el = document.elementFromPoint(ev.clientX, ev.clientY); const pic = el && el.closest(".pic");
        if (over && over !== pic) over.classList.remove("over"); if (pic){ pic.classList.add("over"); } over = pic;
      };
      const up = ev => {
        chip.removeEventListener("pointermove", move); chip.removeEventListener("pointerup", up); chip.removeEventListener("pointercancel", up);
        if (ghost){ ghost.remove(); if (over){ over.classList.remove("over"); placeWord(+over.dataset.i, w); } return; }
        S.picked = S.picked === w ? null : w; document.querySelectorAll("#bank .word").forEach(c => c.setAttribute("aria-pressed", c.dataset.w === S.picked));
      };
      chip.addEventListener("pointermove", move); chip.addEventListener("pointerup", up); chip.addEventListener("pointercancel", up);
    });
  });
  document.querySelectorAll(".pic").forEach(p => {
    const act = () => { if (S.picked) placeWord(+p.dataset.i, S.picked); };
    p.addEventListener("click", e => { if (e.target.closest("[data-back]")) return; act(); });
    p.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); act(); } });
  });
  document.querySelectorAll("[data-back]").forEach(b => b.onclick = e => { e.stopPropagation(); delete S.answers["e1_"+b.dataset.back]; const y = window.scrollY; render(); window.scrollTo(0, y); });
}

function keysFor(step){
  const L = LESSONS[S.lesson]; const keys = [];
  if (step === 0) L.ex1.forEach((_, i) => keys.push(`e1_${i}`));
  if (step === 1) L.ex2.forEach((it, i) => parseTokens(it.en).filter(t => t.t === "gap").forEach((_, g) => keys.push(`e2_${i}_${g}`)));
  if (step === 2) L.ex3.lines.forEach((ln, i) => parseTokens(ln).filter(t => t.t === "gap").forEach((_, g) => keys.push(`e3_${i}_${g}`)));
  if (step === 3) L.ex4.forEach((_, i) => keys.push(`e4_${i}`));
  return keys;
}
function stepProgress(i){ if (i === -1) return S.videoDone ? "✓" : "▶"; if (i === 4) return `${p5Count()}/${(LESSONS[S.lesson].ex5 || []).length}`; const k = keysFor(i); return `${k.filter(x => (S.answers[x]||"").trim()).length}/${k.length}`; }
function countFilled(){ return [0,1,2,3].reduce((a, i) => a + keysFor(i).filter(x => (S.answers[x]||"").trim()).length, 0) + p5Count(); }
function totalBlanks(){ return [0,1,2,3].reduce((a, i) => a + keysFor(i).length, 0) + (LESSONS[S.lesson].ex5 || []).length; }
function p5Count(){ return ((S.p5 && S.p5.res) || []).filter(Boolean).length; }
function updateStepBadges(){ document.querySelectorAll(".steps button").forEach(b => b.querySelector(".done").textContent = stepProgress(+b.dataset.s)); }

/* =========================================================
   6. CHẤM ĐIỂM (tổng 10: BT1 2 · BT2 2 · BT3 2,5 · BT4 1,5 · BT5 thuyết trình 2)
   ========================================================= */
const PAST_WORDS = new Set(["did","didn't","was","wasn't","were","weren't","went","had","took","threw","made","ate","sat","got","came","saw","said","gave","left","found","told","felt","kept","began","ran","wrote","bought","brought","drank","swept","stood","hung","lay","fell","slept","woke","washed","cleared","wiped","carried","stacked","scraped","scrubbed","rinsed","dried","filled","pulled","offered","helped","cooked","cleaned","used","finished","dripped","relaxed","stayed","watched","played","started","wanted","needed","asked","tried","talked","walked","picked","moved","opened","closed","turned","looked","yawned","brushed","changed","listened","texted","chatted","studied"]);
const PRESENT_SHORT = /^(yes|no)\s*,?\s*(i|we|they|you|he|she|it|my \w+)\s+(do|does|don't|doesn't|am|is|are)\b/;
const PAST_SHORT = /^(yes|no)\s*,?\s*(i|we|they|you|he|she|it|my \w+)\s+(did|didn't|was|wasn't|were|weren't)\b/;
const PAST_STRICT = ["did","didn't","was","were","wasn't","weren't","went","took","threw","got","fell","hung","yawned","washed","cleared","wiped"];
const THIRD_BASE = /\b(my (mom|mother|dad|father|sister|brother|grandma|grandmother|grandpa|grandfather|aunt|uncle)|he|she)\s+(usually\s+|often\s+|always\s+|sometimes\s+)?(clear|do|wash|put|use|dry|help|wipe|scrub|carry|rinse|leave|clean|go|brush)\b/;

function gradeEx4(q, ans){
  const a = norm(ans), words = a ? a.split(" ") : [];
  const per = POINTS.ex4 / 4;
  if (!a) return {pts:0, issues:[{cat:"short", msg:"Chưa trả lời."}]};
  const issues = [];
  let tenseOk = true;
  if (q.tense === "QKĐ"){
    const hasPast = words.some(w => PAST_WORDS.has(w)) || (/\b(read|put|set|cut|hit|let|quit)\b/.test(a) && /\b(last|yesterday|ago|this morning)\b/.test(a));
    if (PRESENT_SHORT.test(a) || (words.length >= 4 && !hasPast)){ tenseOk = false; issues.push({cat:"tense", msg:"Câu hỏi ở quá khứ đơn → dùng động từ quá khứ (did, was, washed, went…)."}); }
  } else {
    if (PAST_SHORT.test(a) || words.some(w => PAST_STRICT.includes(w))){ tenseOk = false; issues.push({cat:"tense", msg:"Câu hỏi ở hiện tại đơn → không dùng did / was / went… Ví dụ: “Yes, I do. / No, I don't.”"}); }
    else if (THIRD_BASE.test(a)){ tenseOk = false; issues.push({cat:"third", msg:"Chủ ngữ ngôi thứ 3 số ít (my mom, he, she…) → động từ thêm -s/-es: clears, does, washes."}); }
  }
  const full = words.length >= 4;
  if (!full) issues.push({cat:"short", msg:"Em mới trả lời 1–3 từ. Viết thành câu đầy đủ (có chủ ngữ + động từ) để được điểm tối đa."});
  let pts = full && tenseOk ? per : (full || tenseOk) ? per/2 : 0;
  return {pts, issues};
}

function grade(){
  const L = LESSONS[S.lesson]; const errors = []; const review = {e1:[], e2:[], e3:[], e4:[]};
  // BT1
  let c1 = 0;
  L.ex1.forEach((it, i) => { const got = S.answers["e1_"+i] || ""; if (got === it.w) c1++; else { errors.push({ex:1, item:i+1, cat:"pic", want:it.w, got}); review.e1.push({i, want:it.w, got, vi:it.vi}); } });
  // BT2: mỗi câu đúng hết các ô mới được điểm
  let c2 = 0;
  L.ex2.forEach((it, i) => { let ok = true, g = 0;
    parseTokens(it.en).forEach(t => { if (t.t !== "gap") return; const k = `e2_${i}_${g++}`; const got = S.answers[k] || "";
      if (!t.ans.some(x => norm(x) === norm(got))){ ok = false; errors.push({ex:2, item:i+1, cat:"spell", want:t.ans[0], got}); review.e2.push({i, want:t.ans[0], got, vi:it.vi}); } });
    if (ok) c2++; });
  // BT3: mỗi câu 0,5 điểm, chia theo số ô đúng trong câu
  let p3 = 0, g3ok = 0, g3n = 0;
  L.ex3.lines.forEach((ln, i) => { const gaps = parseTokens(ln).filter(t => t.t === "gap"); let ok = 0;
    gaps.forEach((t, g) => { g3n++; const got = S.answers[`e3_${i}_${g}`] || "";
      if (t.ans.some(x => norm(x) === norm(got))){ ok++; g3ok++; }
      else { const cat = verbCat(t.ans[0], t.hint); errors.push({ex:3, item:i+1, cat, want:t.ans[0], got, base:t.hint}); review.e3.push({i, want:t.ans[0], got, base:t.hint, cat}); } });
    p3 += (POINTS.ex3 / L.ex3.lines.length) * (gaps.length ? ok/gaps.length : 1); });
  // BT4
  let p4 = 0; const answers4 = [];
  L.ex4.forEach((q, i) => { const ans = S.answers["e4_"+i] || ""; const r = gradeEx4(q, ans); p4 += r.pts;
    answers4.push({q:q.q, tense:q.tense, a:ans, pts:r.pts}); r.issues.forEach(is => errors.push({ex:4, item:i+1, cat:is.cat, want:q.tense, got:ans})); review.e4.push({i, ...r, ans}); });
  // BT5 Thuyết trình: lấy kết quả tốt nhất của mỗi câu
  const E5 = L.ex5 || [], res5 = (S.p5 && S.p5.res) || [];
  let s5 = 0; review.e5 = [];
  E5.forEach((it, i) => { const x = res5[i]; const r = x ? x.best : 0; s5 += r; if (r < 0.85) { review.e5.push({i, en:it.en, vi:it.vi, heard:x ? x.heard : "", pct:Math.round(r*100)}); errors.push({ex:5, item:i+1, cat:"speak", want:it.en, got:x ? x.heard : ""}); } });
  const p5 = E5.length ? POINTS.ex5 * s5 / E5.length : 0;
  const p1 = c1 * POINTS.ex1 / L.ex1.length, p2 = c2 * POINTS.ex2 / L.ex2.length;
  const r2 = n => Math.round(n*100)/100;
  return {score:r2(p1+p2+p3+p4+p5), p1:r2(p1), p2:r2(p2), p3:r2(p3), p4:r2(p4), p5:r2(p5), c1, c2, g3ok, g3n, errors, review, answers4};
}

async function submitLesson(){
  const blanks = totalBlanks() - countFilled();
  if (blanks > 0 && !S.confirmBlank){ S.confirmBlank = true; render(); return; }
  const r = grade(); const seconds = Math.round((Date.now() - S.startedAt)/1000);
  S.result = {...r, seconds};
  const rec = {cls:S.cls, name:S.name, lesson:S.lesson, score:r.score, p1:r.p1, p2:r.p2, p3:r.p3, p4:r.p4, p5:r.p5, seconds, errors:r.errors, answers4:r.answers4};
  const btn = $("#submit"); if (btn){ btn.disabled = true; btn.textContent = "Đang nộp…"; }
  try{ const sv = await api.save(S.tok, rec); clearDraft(); S.result.saved = true; S.result.reported = !!(sv && sv.reported); S.result.done = !!(sv && sv.done); S.result.next = sv && sv.next; } catch(e){ S.result.saved = false; S.result.err = e && e.message; S.pendingRec = rec; }
  const h = store.get(histKey(), {}); if (!h[S.lesson] || h[S.lesson].score < r.score) h[S.lesson] = {score:r.score, seconds}; store.set(histKey(), h);
  S.view = "result"; render(); window.scrollTo(0,0);
}

function filtered(){

  return (S.dash || []).filter(r => (f.cls === "all" || r.cls === f.cls) && (f.lesson === "all" || String(r.lesson) === f.lesson) &&
    (f.range === "all" || (now - new Date(r.ts).getTime()) <= (f.range === "week" ? 7 : 30) * 864e5));

function leaderboard(rows){
  const by = {};
  rows.forEach(r => { const k = r.cls + "|" + String(r.name).toLowerCase(); const p = by[k] || (by[k] = {name:r.name, cls:r.cls, best:{}, attempts:0, time:0});
    p.attempts++; p.time += +r.seconds || 0; const b = p.best[r.lesson]; if (!b || +r.score > b.score || (+r.score === b.score && +r.seconds < b.seconds)) p.best[r.lesson] = {score:+r.score, seconds:+r.seconds}; });
  const list = Object.values(by).map(p => { const bs = Object.values(p.best); return {...p, lessons:bs.length, avg:bs.reduce((a, b) => a + b.score, 0)/bs.length, avgTime:p.time/p.attempts}; });
  if (S.rankMode === "score") list.sort((a, b) => b.avg - a.avg || b.lessons - a.lessons || a.avgTime - b.avgTime);
  else list.sort((a, b) => b.lessons - a.lessons || b.attempts - a.attempts || b.avg - a.avg);
  return list;
}
function errorStats(rows){
  const cat = {}, items = {}, all = new Set();
  rows.forEach(r => { const sk = r.cls + "|" + String(r.name).toLowerCase(); all.add(sk);
    (r.errors || []).forEach(e => { (cat[e.cat] = cat[e.cat] || {n:0, s:new Set()}).n++; cat[e.cat].s.add(sk);
      if (e.ex === 4) return; const ik = `${r.lesson}|${e.ex}|${e.want}`; const it = items[ik] || (items[ik] = {lesson:r.lesson, ex:e.ex, want:e.want, base:e.base, n:0, s:new Set(), wrong:{}});
      it.n++; it.s.add(sk); const g = norm(e.got) || "(bỏ trống)"; it.wrong[g] = (it.wrong[g] || 0) + 1; }); });
  const total = all.size || 1;
  return {
    cats:Object.entries(cat).map(([k, v]) => ({k, label:ERR_CATS[k] || k, n:v.n, pct:Math.round(v.s.size/total*100)})).sort((a, b) => b.pct - a.pct || b.n - a.n),
    items:Object.values(items).map(v => ({...v, pct:Math.round(v.s.size/total*100), common:Object.entries(v.wrong).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0])})).sort((a, b) => b.pct - a.pct || b.n - a.n).slice(0, 8),
    total
  };
}
function renderDash(){
  const rows = filtered(), lb = leaderboard(rows), st = errorStats(rows);
  const students = new Set(rows.map(r => r.cls + "|" + String(r.name).toLowerCase())).size;
  const avg = rows.length ? rows.reduce((a, r) => a + (+r.score || 0), 0)/rows.length : 0;

  const sel = (id, opts, val) => `<select id="${id}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === val ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
  const top = lb.slice(0, 3), podOrder = [top[1], top[0], top[2]], medal = p => p === top[0] ? 1 : p === top[1] ? 2 : 3;
  const history = rows.slice().sort((a, b) => new Date(b.ts) - new Date(a.ts));

  $("#app").innerHTML = `<div class="wrap wide">

    <div class="kpis">
      <div class="kpi"><span class="muted small">Học sinh đã làm</span><b>${students}</b></div>
      <div class="kpi"><span class="muted small">Lượt làm bài</span><b>${rows.length}</b></div>
      <div class="kpi"><span class="muted small">Điểm trung bình</span><b>${rows.length ? fmtPt(avg) + "/10" : "–"}</b></div>
      <div class="kpi"><span class="muted small">Thời gian TB / lượt</span><b>${rows.length ? fmtShort(avgT) : "–"}</b></div>
    </div>
    ${!rows.length ? `<div class="empty">Chưa có bài nộp nào trong bộ lọc này. Khi học sinh nộp bài, kết quả sẽ hiện ở đây.</div>` : `
    <div class="grid2">
      <div class="card"><div class="top"><h2>🏆 Bảng xếp hạng</h2><div class="toggle"><button data-m="score" aria-pressed="${S.rankMode==="score"}">Điểm cao</button><button data-m="effort" aria-pressed="${S.rankMode==="effort"}">Chăm chỉ</button></div></div>
        <p class="muted small">${S.rankMode === "score" ? "Xếp theo điểm TB (lấy điểm cao nhất mỗi bài). Bằng điểm thì ưu tiên làm nhiều bài hơn, rồi làm nhanh hơn." : "Xếp theo số bài đã hoàn thành, rồi đến số lượt luyện."}</p>
        <div class="podium">${podOrder.map(p => p ? `<div class="pod p${medal(p)}"><div class="medal m${medal(p)}">${medal(p)}</div><span class="nm">${esc(p.name)}</span><span class="muted small">${esc(p.cls)}</span><b>${S.rankMode === "score" ? fmtPt(p.avg) + "/10" : p.lessons + " bài"}</b></div>` : `<div></div>`).join("")}</div>
        <div class="tbl"><table><thead><tr><th>#</th><th>Học sinh</th><th>Lớp</th><th class="num">Điểm TB</th><th class="num">Số bài</th><th class="num">Lượt</th><th class="num">TG TB</th></tr></thead>
          <tbody>${lb.map((p, i) => `<tr><td class="rank">${i+1}</td><td>${esc(p.name)}</td><td>${esc(p.cls.replace("Xây Nền ",""))}</td><td class="num">${fmtPt(p.avg)}</td><td class="num">${p.lessons}</td><td class="num">${p.attempts}</td><td class="num">${fmtShort(p.avgTime)}</td></tr>`).join("")}</tbody></table></div>
      </div>
      <div class="card"><h2>Lỗi thường gặp</h2>
        <p class="muted small">Theo nhóm lỗi · % = tỉ lệ học sinh mắc ít nhất 1 lần</p>
        <div style="display:flex;flex-direction:column;gap:8px">${st.cats.length ? st.cats.map(c => `<div class="bar"><span>${esc(c.label)}</span><span class="track"><span class="fill" style="width:${c.pct}%"></span></span><span class="v">${c.pct}% · ${c.n} lỗi</span></div>`).join("") : `<p class="muted small">Chưa có lỗi nào.</p>`}</div>
        <h3>Câu sai nhiều nhất</h3>
        <div>${st.items.map(it => `<div class="miss"><span><b>Ngày ${dayOf(it.lesson)} · ${exName[it.ex] || ""}:</b> ${esc(it.want)}${it.base ? ` <span class="muted">(${esc(it.base)})</span>` : ""}<br><span class="muted small">Hay viết: ${it.common.map(esc).join(", ")}</span></span><span class="pct">${it.pct}%</span></div>`).join("") || `<p class="muted small">Chưa có.</p>`}</div>
        <button class="btn" id="copyFix">Sao chép yêu cầu “set bài sửa lỗi”</button>
        <p class="muted small">Dán đoạn đã sao chép vào khung chat với Claude để nhận set bài mới tập trung vào các lỗi này.</p>
        <textarea id="fixText" readonly hidden></textarea>
      </div>
    </div>
    <div class="card"><h2>Lịch sử bài nộp</h2><p class="muted small">Bấm vào một dòng để xem câu trả lời phần Phản xạ và các lỗi.</p>
      <div class="tbl"><table><thead><tr><th>Thời gian nộp</th><th>Học sinh</th><th>Lớp</th><th>Bài</th><th class="num">Điểm</th><th class="num">BT1</th><th class="num">BT2</th><th class="num">BT3</th><th class="num">BT4</th><th class="num">BT5</th><th class="num">Làm trong</th></tr></thead>
      <tbody>${history.map((r, i) => `<tr class="clickable" data-i="${i}"><td>${esc(new Date(r.ts).toLocaleString("vi-VN", {day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"}))}</td><td>${esc(r.name)}</td><td>${esc(String(r.cls).replace("Xây Nền ",""))}</td><td>${esc(r.lesson)}</td><td class="num"><b>${fmtPt(+r.score)}</b></td><td class="num">${fmtPt(+r.p1)}</td><td class="num">${fmtPt(+r.p2)}</td><td class="num">${fmtPt(+r.p3)}</td><td class="num">${fmtPt(+r.p4)}</td><td class="num">${r.p5 == null || isNaN(+r.p5) ? "–" : fmtPt(+r.p5)}</td><td class="num">${fmtShort(r.seconds)}</td></tr>
        ${S.openRow === i ? `<tr class="detail"><td colspan="11"><div class="box">${(r.answers4 || []).map((a, j) => `<div><span class="small muted">Câu ${j+1} (${esc(a.tense)}) · ${fmtPt(+a.pts)} điểm · ${esc(a.q)}</span><br>${esc(a.a) || `<span class="muted">(bỏ trống)</span>`}</div>`).join("")}
          <div class="small"><b>Lỗi BT1–3:</b> ${(r.errors || []).filter(e => e.ex < 4).map(e => `${esc(e.got || "–")} → <span class="want">${esc(e.want)}</span>`).join(" · ") || "không có"}</div></div></td></tr>` : ""}`).join("")}</tbody></table></div></div>`}
  </div>`;
  ["fCls","fLesson","fRange"].forEach(id => $("#"+id).onchange = e => { S.f[{fCls:"cls", fLesson:"lesson", fRange:"range"}[id]] = e.target.value; S.openRow = null; render(); });
  document.querySelectorAll(".toggle button").forEach(b => b.onclick = () => { S.rankMode = b.dataset.m; render(); });
  document.querySelectorAll("tr.clickable").forEach(tr => tr.onclick = () => { const i = +tr.dataset.i; S.openRow = S.openRow === i ? null : i; render(); });

  if ($("#wipe")) $("#wipe").onclick = () => { store.set("demo_attempts_v2", []); loadDash().then(render); };
  if ($("#copyFix")) $("#copyFix").onclick = () => {
    const f = S.f; const txt = `Lớp: ${f.cls === "all" ? "Xây Nền Sáng + Tối" : f.cls} · ${f.lesson === "all" ? "Bài " + Object.keys(LESSONS).join(", ") : "Bài " + f.lesson}\nSố học sinh: ${st.total}\nNhóm lỗi: ${st.cats.map(c => `${c.label} (${c.pct}% HS)`).join("; ")}\nCâu sai nhiều nhất: ${st.items.map(it => `Bài ${it.lesson} ${exName[it.ex]} "${it.want}"${it.base ? " (" + it.base + ")" : ""} – ${it.pct}% HS, hay viết: ${it.common.join(", ")}`).join("; ")}\n\nHãy tổng hợp các lỗi trên và làm 1 set bài tập mới (gồm từ vựng bổ sung nếu cần) tập trung vào đúng các lỗi này.`;
    const ta = $("#fixText"); ta.value = txt;
    navigator.clipboard.writeText(txt).then(() => toast("Đã sao chép")).catch(() => { ta.hidden = false; ta.select(); toast("Đã bôi đen sẵn, chị bấm Ctrl+C để sao chép"); });
  };
}
function seedDemo(){
  const names = ["Nguyễn Minh Anh (mẫu)","Trần Gia Bảo (mẫu)","Lê Ngọc Hân (mẫu)","Phạm Quốc Huy (mẫu)","Võ Thảo My (mẫu)","Đặng Khánh Linh (mẫu)","Bùi Đức Thịnh (mẫu)","Hoàng Yến Nhi (mẫu)"];
  const all = store.get("demo_attempts_v2", []); const now = Date.now();
  const E = {
    "26":[{ex:3,cat:"irr",want:"threw",got:"throwed",base:"throw"},{ex:3,cat:"ied",want:"carried",got:"carryed",base:"carry"},{ex:2,cat:"spell",want:"leftovers",got:"leftover"},{ex:1,cat:"pic",want:"crumb",got:"scrape"},{ex:4,cat:"third",want:"HTĐ",got:"My mom clear the table."},{ex:4,cat:"short",want:"HTĐ",got:"My mom."}],
    "27":[{ex:3,cat:"dbl",want:"scrubbed",got:"scrubed",base:"scrub"},{ex:3,cat:"ied",want:"dried",got:"dryed",base:"dry"},{ex:3,cat:"irr",want:"went",got:"goed",base:"go"},{ex:2,cat:"spell",want:"cupboard",got:"cubboard"},{ex:1,cat:"pic",want:"drain",got:"drip"},{ex:4,cat:"tense",want:"QKĐ",got:"My mom do the dishes."}],
    "34":[{ex:3,cat:"irr",want:"lay",got:"lied",base:"lie"},{ex:3,cat:"irr",want:"hung",got:"hanged",base:"hang"},{ex:3,cat:"irr",want:"fell",got:"falled",base:"fall"},{ex:1,cat:"pic",want:"closet",got:"laundry basket"},{ex:2,cat:"spell",want:"asleep",got:"sleep"},{ex:4,cat:"short",want:"HTĐ",got:"10 p.m."}]
  };
  names.forEach((nm, i) => ["26","27","34"].forEach((ls, j) => { if ((i === 7 && j > 0) || (i === 6 && j === 2)) return;
    const errs = E[ls].filter((_, k) => (i + k) % 3 !== 0).slice(0, 1 + (i % 4));
    const p1 = 2.5 - 0.25*errs.filter(e => e.ex === 1).length, p2 = 2.5 - 0.25*errs.filter(e => e.ex === 2).length, p3 = 3 - 0.25*errs.filter(e => e.ex === 3).length, p4 = 2 - 0.25*errs.filter(e => e.ex === 4).length;
    all.push({ts:new Date(now - (i*3 + j) * 36e5 * 5).toISOString(), cls:i % 2 ? "Xây Nền Tối" : "Xây Nền Sáng", name:nm, lesson:ls, score:p1+p2+p3+p4, p1, p2, p3, p4, seconds:420 + i*41 + j*35, errors:errs,
      answers4:[{q:LESSONS[ls].ex4[0].q, tense:LESSONS[ls].ex4[0].tense, a:"Yes, I do. I help my mom every evening.", pts:0.5},{q:LESSONS[ls].ex4[2].q, tense:LESSONS[ls].ex4[2].tense, a:i % 2 ? "My mom." : "My dad usually does it.", pts:i % 2 ? 0.25 : 0.5}]}); }));
  store.set("demo_attempts_v2", all);
}

function render(){ ({login:renderLogin, lessons:renderLessons, lesson:renderLesson, result:renderResult, tlogin:renderTLogin, dash:renderDash}[S.view] || renderLogin)(); if (S.view === "lesson") saveDraft(); }
render();

/* Khởi động: link có vé (lớp Xây Nền) → vào thẳng ngày được giao; không thì đăng nhập / tài khoản đã lưu */
async function boot60(){
  if (!IS_GAS) return;
  const p = IN_GAS ? await new Promise(res => { try{ google.script.url.getLocation(l => res((l && l.parameter) || {})); }catch(e){ res({}); } })
    : Object.fromEntries(new URLSearchParams(location.search));
  if (IS_WEB && p.t){ try{ history.replaceState(null, "", location.pathname); }catch(e){} }
  try{
    if (p.t){ toast("Đang mở bài…"); const r = await gas("api_ticket", p.t); S.tok = r.token; return goHome(parseInt(p.bai, 10) || 0); }
    const t = store.get("tok60", null);
    if (t){ S.tok = t; return goHome(); }
  }catch(e){ store.set("tok60", null); toast((e && e.message) || "Chưa mở được, em đăng nhập lại nhé."); S.view = "login"; render(); }
}
if (document.readyState === "complete") boot60(); else window.addEventListener("load", boot60);

loadDriveVideos();
