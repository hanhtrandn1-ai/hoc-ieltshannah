/* ------------------------- Bảng điểm ------------------------------- */
var D = { data:null, cls:'', month:'' };
function fmtDur(sec){ if(sec==null) return '–'; sec=Math.round(sec); if(sec<60) return sec+' giây'; var m=Math.floor(sec/60), r=sec%60; return m+' phút'+(r?' '+r+' giây':''); }
/* Điểm cuối cùng (thang 10): ưu tiên điểm cô chấm nếu là số, không thì điểm máy chấm. */
function finalScore(sub){
  if(!sub) return null;
  var t=String(sub.teacherScore||'').replace(',','.'), m=t.match(/^\s*(\d+(?:\.\d+)?)\s*(?:\/\s*(\d+(?:\.\d+)?))?\s*$/);
  if(m){ var v=+m[1], mx=m[2]?+m[2]:10; if(mx>0) return Math.round(v/mx*100)/10; }
  if(sub.autoMax) return Math.round(sub.autoScore/sub.autoMax*100)/10;
  return null;
}
/* Ngày giao bài cho lớp đang xem (bài cũ chưa có ngày giao → ngày tạo bài) */
function giveDate(a, cls){
  var g=a.assignedAt||{};
  if(cls && g[cls]) return g[cls];
  if(g['*']) return g['*'];
  if(!cls){ var v=Object.keys(g).map(function(k){ return g[k]; }).sort()[0]; if(v) return v; }
  return a.createdAt||'';
}
/* Mỗi bài = 1 buổi. Theo tháng dương lịch (ngày giao), hoặc theo "tháng khoá học" nếu tên bài có số kiểu "Super Kids 2.3". */
function lessonKey(a, cls, mode){
  function z(n){ return n<10?'0'+n:''+n; }
  var iso=giveDate(a,cls), d=new Date(iso||Date.now()), num=String(a.title).match(/(\d+)\.(\d+)/);
  var day=z(d.getDate())+'/'+z(d.getMonth()+1);
  if(mode==='course' && num) return {month:'Tháng khoá học '+num[1], mkey:+num[1], order:+num[1]*100+(+num[2]), col:num[1]+'.'+num[2], sub:day};
  if(mode==='course') return {month:'Bài chưa đánh số', mkey:9999, order:d.getTime(), col:day, sub:a.title.slice(0,12)};
  return {month:'Tháng '+(d.getMonth()+1)+'/'+d.getFullYear(), mkey:d.getFullYear()*100+d.getMonth()+1, order:d.getTime(), col:day, sub:num?num[1]+'.'+num[2]:a.title.slice(0,12)};
}
function tabScores(){
  $('#tb').innerHTML='<div class="loading"><div><div class="spin"></div>Đang tải bảng điểm…</div></div>';
  api('t_scores',T.pin).then(function(d){ D.data=d; drawScores(); }).catch(function(e){ $('#tb').innerHTML='<div class="err">'+esc(e.message)+'</div>'; });
}
function drawScores(){
  var d=D.data, lv=T.level, mode=D.mode||'cal';
  var cls=classesOf(lv); if(D.cls && cls.indexOf(D.cls)<0) D.cls='';
  var studs=d.students.filter(function(s){ return s.active && s.levels.indexOf(lv)>=0 && (!D.cls || s.note===D.cls); })
    .sort(function(a,b){ return a.name.localeCompare(b.name,'vi'); });
  var extDone=d.extDone||{};
  var touched={}; d.submissions.forEach(function(x){ touched[x.assignmentId]=1; }); Object.keys(extDone).forEach(function(k){ touched[k.split('|')[0]]=1; });
  var asg=d.assignments.filter(function(a){ return a.level===lv && (a.published || touched[a.id]) && (!D.cls || !a.classes.length || a.classes.indexOf(D.cls)>=0); });
  asg.forEach(function(a){ a._k=lessonKey(a, D.cls, mode); });
  var months=[], mk={}; asg.forEach(function(a){ if(months.indexOf(a._k.month)<0){ months.push(a._k.month); mk[a._k.month]=a._k.mkey; } });
  months.sort(function(x,y){ return mk[x]-mk[y]; });
  if(!D.month || months.indexOf(D.month)<0) D.month=months[months.length-1]||'';
  var cols=asg.filter(function(a){ return a._k.month===D.month; }).sort(function(x,y){ return x._k.order-y._k.order; });
  var sub={}; d.submissions.forEach(function(x){ sub[x.assignmentId+'|'+x.studentId]=x; });
  function cellOf(a,s){
    var k=a.id+'|'+s.id, x=sub[k], e=extDone[k]||0, total=a.partsTotal||1, inApp=total-(a.partsExt||0);
    var app = x ? (x.partsDone==null ? inApp : Math.min(inApp, x.partsDone)) : 0;
    var done=app+e, full = done>=total, sc=(d.scores||{})[k];
    return {x:x, v:sc==null?finalScore(x):sc, done:done, total:total, full:full, any:!!x||e>0};
  }
  var rows=studs.map(function(s){
    var cells=cols.map(function(a){ return cellOf(a,s); });
    var done=cells.filter(function(c){ return c.full; }).length;
    var sum=cells.reduce(function(t,c){ return t+(c.v||0); },0);
    var scored=cells.filter(function(c){ return c.v!=null; }).length;
    var avg=cols.length?Math.round(sum/cols.length*100)/100:null;
    var time=cells.reduce(function(t,c){ return t+((c.x&&c.x.duration)||0); },0);
    return {s:s, cells:cells, done:done, avg:avg, time:time, scored:scored};
  });
  var anyScore=rows.some(function(r){ return r.scored>0; });
  var ranked=rows.slice().sort(function(a,b){ return (anyScore?(b.avg||0)-(a.avg||0):0) || b.done-a.done; });
  ranked.forEach(function(r,i){ r.rank = i>0 && ranked[i-1].avg===r.avg && ranked[i-1].done===r.done ? ranked[i-1].rank : i+1; });
  var sortBy=D.sort||'rank'; var view = sortBy==='rank'?ranked:rows;
  var classAvg = rows.length? Math.round(rows.reduce(function(t,r){ return t+(r.avg||0); },0)/rows.length*100)/100 : 0;
  var fullCount=rows.reduce(function(t,r){ return t+r.done; },0), total=rows.length*cols.length;
  function cellColor(c){
    if(!c.any) return '';
    if(!c.full) return 'background:#FFF3D6;color:#8A5B00';
    var v=c.v; return v==null?'background:#DDF5E5;color:#0E6B34':v>=9?'background:#DDF5E5;color:#0E6B34':v>=7?'background:#E7F3FF;color:#1D5FA8':v>=5?'background:#FFF3D6;color:#8A5B00':'background:#FBE3E0;color:#B3261E';
  }
  function cellText(c){
    if(!c.any) return '<span class="muted">–</span>';
    var part = c.total>1 && !c.full ? '<div style="font-size:11px;font-weight:600">'+c.done+'/'+c.total+' phần</div>' : '';
    if(c.v!=null) return fmtScore(c.v)+part;
    return c.full ? '✔' : c.done+'/'+c.total;
  }
  $('#tb').innerHTML='<h2 style="margin-top:0">Bảng điểm theo tháng</h2>'+levelFilter(false)+
    '<div class="row" style="margin-bottom:12px"><select id="d_cls" style="width:auto"><option value="">Tất cả lớp</option>'+cls.map(function(c){ return '<option'+(c===D.cls?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select>'+
    '<select id="d_mon" style="width:auto">'+(months.length?months.map(function(m){ return '<option'+(m===D.month?' selected':'')+'>'+esc(m)+'</option>'; }).join(''):'<option>Chưa có bài</option>')+'</select>'+
    '<select id="d_mode" style="width:auto"><option value="cal"'+(mode==='cal'?' selected':'')+'>Theo ngày giao</option><option value="course"'+(mode==='course'?' selected':'')+'>Theo tháng khoá học (số bài)</option></select>'+
    '<select id="d_sort" style="width:auto"><option value="rank"'+(sortBy==='rank'?' selected':'')+'>Xếp theo hạng</option><option value="name"'+(sortBy==='name'?' selected':'')+'>Xếp theo tên</option></select></div>'+
    (cols.length?'<div class="chips" style="margin-bottom:12px">'+(anyScore?'<span class="chip brand">ĐTB lớp: '+fmtScore(classAvg)+'</span>':'')+'<span class="chip ok">Làm đủ '+fullCount+'/'+total+' lượt</span><span class="chip">'+cols.length+' buổi</span>'+(D.cls?'':'<span class="chip sun">Chọn 1 lớp để ngày giao chính xác</span>')+'</div>'+
    '<div class="card" style="padding:0;overflow-x:auto"><table class="sc"><thead><tr><th class="stk">#</th><th class="stk2">Học viên</th>'+
      cols.map(function(a,i){ return '<th title="'+esc(a.title)+'">Buổi '+(i+1)+'<div style="font-weight:600">'+esc(a._k.col)+'</div><div class="muted" style="font-size:11px;font-weight:500">'+esc(a._k.sub)+'</div></th>'; }).join('')+'<th>ĐTB</th><th>Làm đủ</th><th>Thời gian</th></tr></thead><tbody>'+
      view.map(function(r){ return '<tr><td class="stk">'+(anyScore&&r.rank<=3&&r.avg>0?['🥇','🥈','🥉'][r.rank-1]:r.rank)+'</td><td class="stk2">'+esc(r.s.name)+(D.cls?'':'<div class="muted" style="font-size:11px">'+esc(r.s.note)+'</div>')+'</td>'+
        r.cells.map(function(c,i){ return '<td class="cl" data-a="'+cols[i].id+'" data-s="'+r.s.id+'" style="'+cellColor(c)+'">'+cellText(c)+'</td>'; }).join('')+
        '<td><b>'+(r.scored?fmtScore(r.avg):'–')+'</b></td><td>'+r.done+'/'+cols.length+'</td><td class="small">'+(r.time?fmtDur(r.time):'–')+'</td></tr>'; }).join('')+
      '</tbody></table></div>'+
      '<p class="muted small">Mỗi cột là 1 buổi (1 bài đã giao), xếp theo ngày giao. Xanh = làm đủ, vàng = mới làm một phần (số phần đã làm/tổng), – = chưa làm. Điểm buổi (thang 10) = trung bình các phần: web 99 và Everyday English lấy điểm của app; nộp ảnh, ghi âm, link: làm xong = 10; bài tự chấm theo tỉ lệ đúng; phần chưa làm = 0. Cô nhập điểm dạng số thì lấy điểm của cô. Chạm vào ô để xem chi tiết.</p>'+
      '<div class="row"><button class="btn sm soft" id="d_copy">📋 Sao chép bảng</button><button class="btn sm plain" id="d_miss">🔔 DS chưa làm buổi gần nhất</button><button class="btn sm plain" id="d_exp">📄 Lưu ra Google Sheet</button><button class="btn sm plain" id="d_rf">↻ Tải lại</button></div>'
     :'<div class="card empty"><div class="e">📊</div>Chưa có bài nào được giao cho lớp này.</div>');
  bindFilter(function(){ D.month=''; drawScores(); });
  $('#d_cls').onchange=function(){ D.cls=this.value; D.month=''; drawScores(); };
  $('#d_mon').onchange=function(){ D.month=this.value; drawScores(); };
  $('#d_mode').onchange=function(){ D.mode=this.value; D.month=''; drawScores(); };
  $('#d_sort').onchange=function(){ D.sort=this.value; drawScores(); };
  if(!cols.length) return;
  $('#d_rf').onclick=tabScores;
  function table2D(){
    var head=['Hạng','Học viên','Lớp'].concat(cols.map(function(a,i){ return 'Buổi '+(i+1)+' ('+a._k.col+')'; })).concat(['ĐTB','Làm đủ','Thời gian làm']);
    return [head].concat(ranked.map(function(r){ return [r.rank, r.s.name, r.s.note].concat(r.cells.map(function(c){ return !c.any?'':c.v!=null?c.v+(c.full?'':' ('+c.done+'/'+c.total+')'):(c.full?'xong':c.done+'/'+c.total); })).concat([r.scored?r.avg:'', r.done+'/'+cols.length, fmtDur(r.time)]); }));
  }
  $('#d_copy').onclick=function(){ copyText(LV[lv].name+(D.cls?' – '+D.cls:'')+' – '+D.month+'\n'+table2D().map(function(r){ return r.join('\t'); }).join('\n')); };
  $('#d_miss').onclick=function(){
    var a=cols[cols.length-1], i=cols.length-1;
    var miss=rows.filter(function(r){ return !r.cells[i].full; });
    copyText(miss.length?'📌 Bài "'+a.title+'" (giao '+a._k.col+') – các bạn chưa làm xong:\n'+miss.map(function(r,n){ var c=r.cells[i]; return (n+1)+'. '+r.s.name+(c.any&&c.total>1?' ('+c.done+'/'+c.total+' phần)':''); }).join('\n')+'\nPhụ huynh nhắc con hoàn thành trước buổi học sau giúp cô nhé. Cảm ơn ạ!'
      :'🎉 Cả lớp đã làm đủ bài "'+a.title+'". Cô khen cả lớp!');
  };
  $('#d_exp').onclick=function(){ var b=this; b.disabled=true; b.textContent='Đang lưu…';
    var name='BĐ '+(D.cls||LV[lv].name)+' '+D.month;
    api('t_exportScores',T.pin,name,table2D()).then(function(url){ b.disabled=false; b.textContent='📄 Lưu ra Google Sheet';
      modal('<h3>Đã lưu bảng điểm</h3><p>Trang "<b>'+esc(name)+'</b>" trong Google Sheet của app.</p><p><a href="'+esc(url)+'" target="_blank">Mở Google Sheet</a></p>',[{label:'Đóng'}]); })
      .catch(function(e){ b.disabled=false; b.textContent='📄 Lưu ra Google Sheet'; toast(e.message); }); };
  $$('.cl',$('#tb')).forEach(function(td){ td.onclick=function(){
    var x=sub[td.dataset.a+'|'+td.dataset.s], a=cols.filter(function(c){ return c.id===td.dataset.a; })[0], st=studs.filter(function(q){ return q.id===td.dataset.s; })[0];
    var c=cellOf(a,st);
    if(!c.any){ toast(st.name+' chưa làm buổi '+a._k.col); return; }
    modal('<h3>'+esc(st.name)+' · '+esc(a.title)+'</h3>'+
      '<div class="ans">📅 Giao ngày: '+fmtDay(giveDate(a,D.cls||st.note))+'</div>'+
      (c.v!=null?'<div class="ans">⭐ Điểm buổi (thang 10): <b>'+fmtScore(c.v)+'</b></div>':'')+
      (c.total>1?'<div class="ans">🧩 Đã làm: <b>'+c.done+'/'+c.total+' phần</b></div>':'')+
      (x?
      (x.autoMax?'<div class="ans">🤖 App tự chấm: '+fmtScore(x.autoScore)+'/'+fmtScore(x.autoMax)+'</div>':'')+
      (x.teacherScore?'<div class="ans">👩‍🏫 Cô chấm: '+esc(x.teacherScore)+'</div>':'')+
      '<div class="ans">🕒 Nộp lần đầu: '+fmtTime(x.firstSubmittedAt)+'</div><div class="ans">🕒 Nộp gần nhất: '+fmtTime(x.submittedAt)+' (lần '+x.attempts+')</div>'+
      '<div class="ans">⏱ Thời gian làm: '+fmtDur(x.duration)+'</div>'+(x.comment?'<div class="fb">💬 '+esc(x.comment)+'</div>':''):'<div class="ans muted">Chưa bấm Nộp bài trong app (mới làm phần trên web khác).</div>')+
      '<div id="d_det" style="max-height:55vh;overflow:auto;margin-top:8px"><div class="muted small">Đang tải bài làm…</div></div>',[{label:'Đóng'}]);
    api('t_getSubmissions',T.pin,a.id).then(function(g){
      var box=$('#d_det'); if(!box) return;
      var full=g.submissions.filter(function(q){ return q.studentId===st.id; })[0];
      var ex=(g.ext||{})[st.id];
      box.innerHTML=full?'<b>Bài làm – đúng / sai từng câu</b>'+detailHtml(g.assignment,full,ex):(ex?'<b>Nhiệm vụ trên web khác</b>'+g.assignment.activities.filter(isExt).map(function(act){ return extLines(act,ex); }).join(''):'<div class="muted small">Không tìm thấy bài làm.</div>');
      bindAudio(box);
    }).catch(function(e){ var box=$('#d_det'); if(box) box.textContent=e.message; });
  }; });
}

/* ------------------------- Học viên -------------------------------- */
function tabStudents(){
  var lv=T.level, cls=classesOf(lv);
  if(!T.stCls || cls.indexOf(T.stCls)<0) T.stCls=cls[0]||'';
  T.stQ=T.stQ||''; T.stF=T.stF||'all';
  var head='<h2 style="margin-top:0">Hồ sơ học viên</h2>'+levelFilter(false)+
    (cls.length?'<div class="filter" id="stcls">'+cls.map(function(c){ return '<button data-c="'+esc(c)+'" class="'+(c===T.stCls?'on':'')+'">'+esc(c)+'</button>'; }).join('')+'</div>':'');
  if(!cls.length){
    $('#tb').innerHTML=head+'<div class="card empty">Cấp độ này chưa có lớp nào.</div>'+stAddForm(lv);
    bindFilter(tabStudents); stBindAdd(lv); return;
  }
  var key=T.stCls, hit=(T.stCache||{})[key];
  var bindTop=function(){
    bindFilter(tabStudents);
    $$('#stcls button').forEach(function(b){ b.onclick=function(){ T.stCls=b.dataset.c; tabStudents(); }; });
  };
  if(!hit){
    $('#tb').innerHTML=head+'<div class="loading"><div><div class="spin"></div>Đang tính tiến độ của lớp…</div></div>';
    bindTop();
    api('t_profileList',T.pin,key).then(function(list){ (T.stCache=T.stCache||{})[key]={list:list,at:Date.now()}; if(T.tab==='students'&&T.stCls===key) tabStudents(); })
      .catch(function(e){ $('#tb').innerHTML=head+'<div class="card err">'+esc(e.message||e)+'</div>'; bindTop(); });
    return;
  }
  var all=hit.list, q=plainVi(T.stQ);
  var act=all.filter(function(s){ return s.active; });
  var weak=act.filter(function(s){ return s.stats && s.stats.rate!==null && s.stats.rate<60; });
  var list=all.filter(function(s){
    if(T.stF==='weak' && !(s.active && s.stats && s.stats.rate!==null && s.stats.rate<60)) return false;
    if(T.stF==='off' && s.active) return false;
    if((T.stF==='all'||T.stF==='fire') && !s.active) return false;
    return !q || plainVi(s.name).indexOf(q)>=0;
  });
  if(T.stF==='fire') list.sort(function(a,b){ var fa=a.fc||{}, fb=b.fc||{}; return (fb.streak||0)-(fa.streak||0) || (fb.learned||0)-(fa.learned||0); });
  var avgRate=function(arr){ var n=0,t=0; arr.forEach(function(s){ if(s.stats&&s.stats.rate!==null){ n++; t+=s.stats.rate; } }); return n?Math.round(t/n):null; };
  var cr=avgRate(act);
  $('#tb').innerHTML=head+
    '<div class="stsum"><div><b>'+act.length+'</b><span>đang học</span></div><div><b>'+(cr===null?'–':cr+'%')+'</b><span>nộp bài TB</span></div><div class="'+(weak.length?'bad':'')+'"><b>'+weak.length+'</b><span>nộp dưới 60%</span></div></div>'+
    '<div class="funbtns"><button class="btn soft" id="fduck">🦆 Đua vịt gọi khảo bài</button><button class="btn soft" id="fgrp">👥 Chia nhóm</button></div>'+
    '<div class="card"><div class="row" style="margin-bottom:6px"><input type="search" id="stq" placeholder="🔎 Tìm tên học viên…" value="'+esc(T.stQ)+'" style="flex:1;min-width:160px">'+
    '<select id="stf" style="width:auto"><option value="all"'+(T.stF==='all'?' selected':'')+'>Đang học</option><option value="weak"'+(T.stF==='weak'?' selected':'')+'>Nộp bài dưới 60%</option><option value="fire"'+(T.stF==='fire'?' selected':'')+'>🔥 Xếp theo chuỗi ngày học</option>'+(isAdmin()?'<option value="off"'+(T.stF==='off'?' selected':'')+'>Đã nghỉ / bảo lưu</option>':'')+'</select>'+
    '<button class="btn sm plain" id="strf" title="Tính lại">↻</button></div>'+
    (list.length?list.map(stRow).join(''):'<div class="muted" style="padding:10px 4px">Không có học viên phù hợp.</div>')+
    '<p class="muted small" style="margin:10px 0 0">Bấm vào tên để mở hồ sơ. Tỉ lệ nộp bài tính các bài đã giao từ 1 ngày trước. Điểm TB: trung bình điểm các bài đã làm (thang 10).</p></div>'+
    stAddForm(lv);
  bindTop();
  var sq=$('#stq'); sq.oninput=function(){ T.stQ=sq.value; var p=sq.selectionStart; tabStudents(); var n=$('#stq'); n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} };
  $('#stf').onchange=function(){ T.stF=this.value; tabStudents(); };
  $('#strf').onclick=function(){ delete T.stCache[key]; tabStudents(); };
  $$('[data-pf]').forEach(function(r){ r.onclick=function(){ openProfile(r.dataset.pf); }; });
  $('#fduck').onclick=duckRace; $('#fgrp').onclick=splitGroups;
  stBindAdd(lv);
}
function plainVi(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim(); }
function rateChip(r){ return r===null||r===undefined?'<span class="chip">Chưa có bài</span>':'<span class="chip '+(r>=80?'ok':r>=60?'sun':'bad')+'">📚 Nộp '+r+'%</span>'; }
function stRow(s){
  var x=s.stats||{};
  return '<div class="st-row" data-pf="'+esc(s.id)+'"><div class="n">'+esc(s.name)+
    '<div class="muted small">'+(s.active?'':'<b style="color:var(--bad)">'+esc(s.status||'Đã nghỉ')+'</b> · ')+(x.last?'Làm bài gần nhất '+fmtDay(x.last):(s.active?'Chưa làm bài nào':''))+'</div></div>'+
    '<div class="chips" style="justify-content:flex-end">'+(s.active?rateChip(x.rate)+(x.avg!==null&&x.avg!==undefined?'<span class="chip brand">⭐ '+fmtScore(x.avg)+'</span>':'')+(x.mtCount?'<span class="chip">📝 MT '+fmtScore(x.mtAvg)+'/10</span>':'')+(s.fc&&s.fc.streak?'<span class="chip sun">🔥 '+s.fc.streak+'</span>':'')+(s.fc&&s.fc.learned?'<span class="chip">🃏 '+s.fc.learned+' từ</span>':''):'')+'</div><span class="muted">›</span></div>';
}
function stAddForm(lv){
  if(!isAdmin()) return '<p class="muted small">Danh sách học viên được đồng bộ tự động từ Sổ Lớp mỗi tối. Cần thêm hoặc chuyển lớp, cô báo cô Hannah nhé.</p>';
  return '<details class="card"><summary><b>➕ Thêm học viên thủ công</b> <span class="muted small">(thường không cần – Sổ Lớp tự đồng bộ mỗi tối)</span></summary>'+
    '<label class="f">Tên lớp</label><input type="text" id="newcls" list="clslist" placeholder="VD: Xây Nền Sáng" value="'+esc(T.stCls||'')+'"><datalist id="clslist">'+classesOf(lv).map(function(c){ return '<option value="'+esc(c)+'">'; }).join('')+'</datalist>'+
    '<label class="f">Danh sách tên (mỗi dòng 1 bạn)</label><textarea id="newnames" placeholder="Nguyễn Minh Anh\nTrần Bảo Ngọc\n…"></textarea><button class="btn" id="addst" style="margin-top:10px">Thêm vào lớp '+esc(LV[lv].name)+'</button></details>';
}
function stBindAdd(lv){
  if(!isAdmin() || !$('#addst')) return;
  $('#addst').onclick=function(){
    var names=$('#newnames').value.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
    if(!names.length) return;
    $('#addst').disabled=true;
    api('t_addStudents',T.pin,lv,names,$('#newcls').value.trim()).then(function(n){ toast('Đã thêm '+n+' học viên'); T.stCache={}; loadTeacher(); }).catch(function(e){ toast(e.message); $('#addst').disabled=false; });
  };
}

/* ---------------- Trang hồ sơ 1 học viên ---------------- */
function openProfile(id){
  var L=$('#layer');
  L.innerHTML='<div class="pfv"><div class="pfbar"><button class="btn sm plain" id="pfx">← Quay lại</button><b>Hồ sơ học viên</b></div><div class="pfscroll"><div class="loading"><div><div class="spin"></div>Đang mở hồ sơ…</div></div></div></div>';
  var close=function(){ L.innerHTML=''; };
  $('#pfx',L).onclick=close;
  api('t_profile',T.pin,id).then(function(p){ renderProfile(p); }).catch(function(e){ $('.pfscroll',L).innerHTML='<div class="card err" style="margin:16px">'+esc(e.message||e)+'</div>'; });
}
function renderProfile(p){
  var L=$('#layer'), s=p.student, i=p.info, x=p.stats||{}, link=studentLink(s.code);
  var box=function(v,lab,cls){ return '<div class="'+(cls||'')+'"><b>'+v+'</b><span>'+lab+'</span></div>'; };

function qrSvg(text){
  var q=qrcode(0,'M'); q.addData(text); q.make();
  var n=q.getModuleCount(), d='';
  for(var r=0;r<n;r++) for(var c=0;c<n;c++) if(q.isDark(r,c)) d+='M'+c+' '+r+'h1v1h-1z';
  return '<svg viewBox="-2 -2 '+(n+4)+' '+(n+4)+'" shape-rendering="crispEdges"><rect x="-2" y="-2" width="'+(n+4)+'" height="'+(n+4)+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
}

  var d=MT.cache[lv];

    api('t_mtList',T.pin,lv).then(function(r){ MT.cache[lv]=r; if(T.tab==='mini'&&T.mtLevel===lv) tabMini(); }).catch(function(e){ $('#tb').innerHTML=head+'<div class="card empty">'+esc(e.message||e)+'</div>'; mtBindLv(); });

function mtSlides(t){
  var S=[], P=t.pages;
  P.forEach(function(p){
    var pt=' ('+String(p.pts).replace('.',',')+'đ)';
    if(p.t==='review') S.push({kind:'review',p:p,head:'⏱ '+p.title+' – '+p.min+' phút',timer:p.min,foot:'Học sinh đọc to từ vựng & cấu trúc. Hết 5 phút chuyển sang phần kiểm tra.'});
    else if(p.t==='sounds'){ for(var i=0;i<p.cards.length;i+=8) S.push({kind:'sounds',p:p,cards:p.cards.slice(i,i+8),head:p.title+pt+(p.cards.length>8?' · '+(i/8+1)+'/'+Math.ceil(p.cards.length/8):''),foot:p.how}); }
    else if(p.t==='blend') p.words.forEach(function(w,k){ S.push({kind:'blend',p:p,w:w,head:'Blending '+(k+1)+'/'+p.words.length+' · '+p.title.replace('Blending – ','')+pt,foot:p.how}); });
    else if(p.t==='qa') S.push({kind:'qa',p:p,head:'Questions and Answers'+pt,foot:p.rub+(p.note?' · ⚠️ '+p.note:'')});
    else if(p.t==='mind') S.push({kind:'mind',p:p,head:p.title+pt,foot:p.how});
    else if(p.t==='mcq') p.items.forEach(function(it,k){ S.push({kind:'mcq',p:p,it:it,n:k+1,head:p.title+' · Câu '+(k+1)+'/'+p.items.length+pt,foot:p.how}); });
    else if(p.t==='miss') p.items.forEach(function(it,k){ S.push({kind:'miss',p:p,it:it,n:k+1,head:p.title+' · '+(k+1)+'/'+p.items.length+pt,foot:p.how}); });
    else if(p.t==='yvocab'||p.t==='yerr'||p.t==='ytr') S.push({kind:p.t,p:p,head:p.title,foot:p.how,test:true});
  });
  return S;
}

  }
  if(sl.kind==='review'){
    var v='<table>'+p.vocab.map(function(x){ return '<tr><td>'+esc(x[0])+'<span class="mttag '+(x[2]==='new'?'n':'o')+'">'+(x[2]==='new'?'MỚI':'ÔN')+'</span></td><td>'+esc(x[1])+'</td></tr>'; }).join('')+'</table>';
    var g=p.grammar.map(function(x){ return '<div class="mtgb"><h4>'+esc(x.name)+'<span class="mttag '+(x.new?'n':'o')+'">'+(x.new?'MỚI':'ÔN')+'</span></h4><div><b>Cấu trúc:</b> '+esc(x.f)+'</div><div><b>Nghĩa & cách dùng:</b> '+esc(x.u)+'</div><div><b>Ví dụ:</b> '+x.ex.map(esc).join(' · ')+'</div><div class="w">⚠️ '+esc(x.w)+'</div></div>'; }).join('');

function mtShow(t){
  var S=mtSlides(t), i=0, ans=false, timer=null, left=0, timerFor='';
  var L=document.createElement('div'); L.className='mtp'; document.body.appendChild(L);
  document.body.style.overflow='hidden';
  function stopT(){ if(timer){ clearInterval(timer); timer=null; } }
  function fmt(s){ var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
  function startT(min,key){ stopT(); left=min*60; timerFor=key; tick(); timer=setInterval(function(){ left--; tick(); if(left<=0){ stopT(); } },1000); }
  function tick(){ var el=$('.mttim',L); if(!el) return; el.textContent='⏱ '+fmt(Math.max(0,left)); el.classList.toggle('end',left<=0); }
  function close(){ stopT(); L.remove(); document.body.style.overflow=''; document.onkeydown=null; try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){} }
  function draw(){
    var sl=S[i]; var isY=t.mode==='yle';
    var tim='';
    if(isY){
      if(sl.kind==='review') tim=timerFor==='rv'?'<span class="mttim"></span>':'<button class="mtbtn" id="mtgo">▶ Bắt đầu ôn 5 phút</button>';
      else tim=timerFor==='test'?'<span class="mttim"></span>':'<button class="mtbtn" id="mtgo">▶ Bắt đầu làm bài 10 phút</button>';
    }
    L.innerHTML='<div class="mtbar"><button class="mtx" id="mtx" title="Đóng">✕</button><div class="grp"><button id="mtpv">‹</button><span>'+esc(t.title)+' · '+(i+1)+'/'+S.length+'</span><button id="mtnx">›</button></div>'+
      tim+(isY&&sl.test?'<button class="mtbtn'+(ans?' on':'')+'" id="mtans">👁 Đáp án</button>':'')+'<span style="flex:1"></span><button class="mtbtn" id="mtfs" title="Toàn màn hình">⛶</button><button class="mtbtn" id="mtsc">✏️ Chấm điểm</button></div>'+
      '<div class="mthead">'+esc(sl.head)+'</div><div class="mtstage">'+mtSlideHtml(t,sl,ans)+'</div><div class="mtfoot">'+esc(sl.foot||'')+'</div>';
    tick();
    $('#mtx',L).onclick=close;
    $('#mtpv',L).onclick=function(){ if(i>0){ i--; draw(); } };
    $('#mtnx',L).onclick=function(){ if(i<S.length-1){ i++; draw(); } };
    if($('#mtgo',L)) $('#mtgo',L).onclick=function(){ if(sl.kind==='review') startT(5,'rv'); else startT(t.testMin||10,'test'); draw(); };
    if($('#mtans',L)) $('#mtans',L).onclick=function(){ ans=!ans; draw(); };
    $('#mtfs',L).onclick=function(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else L.requestFullscreen(); }catch(e){ toast('Trình duyệt không hỗ trợ toàn màn hình'); } };
    $('#mtsc',L).onclick=function(){ close(); mtScore(t); };
    $$('[data-say]',L).forEach(function(b){ b.onclick=function(){ mtSay(b.dataset.say, b.dataset.rate?+b.dataset.rate:0.75); }; });
  }
  document.onkeydown=function(e){ if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){ e.preventDefault(); if(i<S.length-1){ i++; draw(); } } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ if(i>0){ i--; draw(); } } else if(e.key==='Escape'&&!document.fullscreenElement) close(); };
  var sx=null; L.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  L.addEventListener('touchend',function(e){ if(sx===null) return; var dx=e.changedTouches[0].clientX-sx; sx=null; if(Math.abs(dx)>60){ if(dx<0&&i<S.length-1) i++; else if(dx>0&&i>0) i--; draw(); } });
  draw();
}

      st.map(function(s,k){ var o=map[s.id]||{}; return '<tr data-id="'+esc(s.id)+'" data-nm="'+esc(s.name)+'"><td>'+(k+1)+'</td><td>'+esc(s.name)+'</td>'+

var LP_TIMER=null;
function lpTimerUI(host){
  var st={left:0,total:0,run:false,iv:null};
  host.innerHTML='<div class="lptm"><span class="lptd">0:00</span><button data-a="go" title="Chạy / dừng">▶</button><button data-a="rs" title="Đặt lại">↺</button>'+
    [1,2,3,5,10].map(function(n){ return '<button data-p="'+n+'">'+n+'’</button>'; }).join('')+'</div>';
  var disp=$('.lptd',host), go=$('[data-a=go]',host);
  function fmt(s){ var m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }
  function draw(){ disp.textContent=fmt(Math.max(0,st.left)); host.firstChild.classList.toggle('end',st.total>0&&st.left<=0); go.textContent=st.run?'⏸':'▶'; }
  function beep(){ try{ var A=new (window.AudioContext||window.webkitAudioContext)(); [0,0.35,0.7].forEach(function(t){ var o=A.createOscillator(),g=A.createGain(); o.frequency.value=880; o.connect(g); g.connect(A.destination); g.gain.value=0.15; o.start(A.currentTime+t); o.stop(A.currentTime+t+0.22); }); }catch(e){} }
  function stop(){ st.run=false; if(st.iv){ clearInterval(st.iv); st.iv=null; } draw(); }
  function start(){ if(st.left<=0) return; st.run=true; if(st.iv) clearInterval(st.iv); st.iv=setInterval(function(){ st.left--; if(st.left<=0){ stop(); beep(); } draw(); },1000); draw(); }
  function set(min){ stop(); st.total=st.left=Math.round(min*60); start(); }
  go.onclick=function(){ if(st.run) stop(); else start(); };
  $('[data-a=rs]',host).onclick=function(){ stop(); st.left=st.total; draw(); };
  $$('[data-p]',host).forEach(function(b){ b.onclick=function(){ set(+b.dataset.p); }; });
  draw();
  return { set:set, stop:stop };
}

var SL = { loaded:false, loading:false, classes:[], students:[], alerts:{}, logs:[], logsLoaded:false, view:'classes', branch:'all', cls:'all', status:'active', q:'' };
function slTodayVN(){
  var d=new Date(), dd=('0'+d.getDate()).slice(-2), mm=('0'+(d.getMonth()+1)).slice(-2), yy=d.getFullYear();
  return dd+'/'+mm+'/'+yy;
}
function slCurMonthStr(){
  var d=new Date(), mm=('0'+(d.getMonth()+1)).slice(-2), yy=d.getFullYear();
  return mm+'/'+yy;
}
function slParseVNDate(str){
  var m=String(str||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m) return null;
  return new Date(+m[3], +m[2]-1, +m[1]);
}
function slDaysSince(str){
  var d=slParseVNDate(str); if(!d) return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}
function slFmtMoney(v){
  var n=Number(String(v||'').replace(/[^\d]/g,''));
  return n ? n.toLocaleString('vi-VN')+'đ' : (v||'–');
}
function slLower(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function slIsLeft(st){
  var s=String((st&&st.status)||'').toLowerCase();
  return s.indexOf('nghỉ')>=0 || s.indexOf('thôi')>=0;
}
function slIsTrial(st){
  var s=String((st&&st.status)||'').toLowerCase();
  var n=String((st&&st.note)||'').toLowerCase();
  return s.indexOf('thử')>=0 || (s.indexOf('đang')>=0 && n.indexOf('học thử')>=0 && n.indexOf('hv mới')>=0);
}
function slNeedFollowTrial(st){
  if(slIsLeft(st) || !slIsTrial(st)) return false;
  if(st.lastPaidDate) return false;
  var d=slDaysSince(st.trialDate);
  return d===null || d>=1;
}
function slClassOf(name){
  for(var i=0;i<(SL.classes||[]).length;i++) if(SL.classes[i].name===name) return SL.classes[i];
  return null;
}
function slTargetPaidMonth(st){
  var c=slClassOf(st.className);
  return (c&&c.currentMonth)?('Tháng '+c.currentMonth):slCurMonthStr();
}
function slIsPaidCur(st){
  if(slIsLeft(st)) return true;
  var pm=String(st.paidMonth||'').trim();
  if(!pm) return false;
  var target=slTargetPaidMonth(st), curM=slCurMonthStr();
  return pm===target || pm===curM || pm.indexOf(curM)>=0;
}
function slOverdueDays(st){
  if(slIsLeft(st) || slIsPaidCur(st)) return 0;
  var ref=st.lastPaidDate || st.feeStartDate || st.trialDate;
  var d=slDaysSince(ref);
  return (d!==null && d>45) ? d : 0;
}

  } else {
    var q=SL.q.toLowerCase().trim();
    var fSt=sts.filter(function(s){
      if(SL.cls!=='all' && s.className!==SL.cls) return false;
      if(SL.status==='active' && slIsLeft(s)) return false;
      if(SL.status==='trial_need' && !slNeedFollowTrial(s)) return false;
      if(SL.status==='unpaid' && (slIsLeft(s) || slIsPaidCur(s))) return false;
      if(SL.status==='overdue' && slOverdueDays(s)<=0) return false;
      if(SL.status==='trial' && !slIsTrial(s)) return false;
      if(SL.status==='left' && !slIsLeft(s)) return false;
      if(SL.status==='hold' && String(s.status||'').toLowerCase().indexOf('bảo lưu')<0) return false;
      if(q){
        var hay=[s.name,s.phone,s.otherPhone,s.parentName,s.className,s.note].join(' ').toLowerCase();
        if(hay.indexOf(q)<0) return false;
      }
      return true;
    });
    html+='<div class="card" style="padding:12px;margin-bottom:12px"><div class="row" style="flex-wrap:wrap;gap:8px">'+
      '<input type="text" id="slQ" value="'+esc(SL.q)+'" placeholder="🔍 Tìm tên bé, SĐT, phụ huynh…" style="flex:1;min-width:200px;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px">'+
      '<select id="slClsF" style="padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;max-width:220px"><option value="all">Tất cả lớp ('+clss.length+')</option>'+
        clss.map(function(c){ return '<option value="'+esc(c.name)+'"'+(SL.cls===c.name?' selected':'')+'>'+esc(c.name)+'</option>'; }).join('')+
      '</select>'+
      '<select id="slStF" style="padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px">'+
        '<option value="active"'+(SL.status==='active'?' selected':'')+'>Đang học & Học thử</option>'+
        '<option value="trial_need"'+(SL.status==='trial_need'?' selected':'')+'>⏳ Học thử cần chốt</option>'+
        '<option value="unpaid"'+(SL.status==='unpaid'?' selected':'')+'>💸 Chưa đóng phí tháng này</option>'+
        '<option value="overdue"'+(SL.status==='overdue'?' selected':'')+'>🚨 Quá hạn > 45 ngày</option>'+
        '<option value="trial"'+(SL.status==='trial'?' selected':'')+'>Chỉ Học thử mới</option>'+
        '<option value="left"'+(SL.status==='left'?' selected':'')+'>Đã nghỉ</option>'+
        '<option value="hold"'+(SL.status==='hold'?' selected':'')+'>Bảo lưu</option>'+
        '<option value="all"'+(SL.status==='all'?' selected':'')+'>Tất cả trạng thái</option>'+
      '</select>'+
    '</div><div class="muted small" style="margin-top:8px">Hiển thị <b>'+fSt.length+'</b> học viên</div></div>';

    if(!fSt.length){
      html+='<div class="card empty">Không tìm thấy học viên nào phù hợp.</div>';
    } else {
      fSt.slice(0, 150).forEach(function(s){
        var left=slIsLeft(s), trial=slIsTrial(s), paid=slIsPaidCur(s), od=slOverdueDays(s);
        var al=SL.alerts[slLower(s.name)]||{};
        var badge=left?'<span class="chip bad">Đã nghỉ</span>':(trial?'<span class="chip sun">Học thử</span>':'<span class="chip ok">'+esc(s.status||'Đang học')+'</span>');
        var feeBadge=left?'':(paid?'<span class="chip ok">✅ Đã đóng '+esc(s.paidMonth)+'</span>':(od>0?'<span class="chip bad">🚨 Quá hạn '+od+' ngày</span>':'<span class="chip">💸 Chưa đóng phí</span>'));
        var warnHtml='';
        if(al.code) warnHtml+='<span class="chip">🔑 '+esc(al.code)+'</span>';
        if(!left && al.hwMissing>=2) warnHtml+='<span class="chip bad">⚠️ Thiếu '+al.hwMissing+' BTVN</span>';
        else if(!left && al.hwMissing===1) warnHtml+='<span class="chip sun">⚠️ Thiếu 1 BTVN</span>';
        if(!left && al.mtLow>=2) warnHtml+='<span class="chip bad">⚠️ MT dưới TB '+al.mtLow+' lần</span>';
        else if(!left && al.mtLow===1) warnHtml+='<span class="chip sun">⚠️ MT dưới TB 1 lần</span>';

        html+='<div class="card" style="padding:12px 14px;margin-bottom:8px">'+
          '<div class="row between" style="align-items:flex-start;flex-wrap:wrap;gap:8px">'+
            '<div>'+
              '<div style="font-weight:700;font-size:15px">'+esc(s.name)+(s.dob?' <span class="muted small">('+esc(s.dob)+')</span>':'')+' '+badge+' '+feeBadge+'</div>'+
              (warnHtml?'<div class="chips" style="margin-top:4px">'+warnHtml+'</div>':'')+
              '<div class="muted small" style="margin-top:4px">🏫 <b>'+esc(s.className||'–')+'</b>'+(s.branch?' ('+esc(s.branch)+')':'')+(s.phone?' · 📞 '+esc(s.phone):'')+(s.parentName?' · PH: '+esc(s.parentName):'')+'</div>'+
              '<div class="muted small" style="margin-top:2px">💰 HP: '+slFmtMoney(s.monthlyFeeApplied||s.originalFee)+(s.discountNote?' · 🏷️ '+esc(s.discountNote):'')+(s.lastPaidDate?' · Đóng gần nhất: '+esc(s.lastPaidDate):'')+(s.leaveDate?' · Nghỉ: '+esc(s.leaveDate)+(s.leaveReason?' ('+esc(s.leaveReason)+')':''):'')+'</div>'+
              (s.note?'<div class="small" style="color:#475569;margin-top:4px">📝 '+esc(s.note)+'</div>':'')+
            '</div>'+
            '<div class="row" style="gap:6px;flex-wrap:wrap">'+
              (!left&&!paid?'<button class="btn sm" data-slpay="'+esc(s.id)+'">💵 Đóng phí</button>':'')+
              (!left?'<button class="btn sm accent" data-slmsg="'+esc(s.id)+'">💬 Tin HP</button>':'')+
              '<button class="btn sm soft" data-sleds="'+esc(s.id)+'">✏️ Sửa</button>'+
              (!left?'<button class="btn sm plain" data-sltr="'+esc(s.id)+'">🔀 Chuyển lớp</button>':'')+
              (!left?'<button class="btn sm warn" data-sllv="'+esc(s.id)+'">🚪 Nghỉ học</button>':'')+
            '</div>'+
          '</div>'+
        '</div>';
      });
      if(fSt.length>150) html+='<div class="muted small" style="text-align:center;padding:8px">Đang hiện 150/'+fSt.length+' học viên. Hãy lọc theo lớp hoặc nhập từ khóa tìm kiếm để xem chính xác hơn.</div>';
    }
  }

  $('#tb').innerHTML=html;
  slBindCommon();
}
function slBindCommon(){
  $('#slVCls').onclick=function(){ SL.view='classes'; renderSoLop(); };

  $('#slVLog').onclick=function(){ SL.view='logs'; SL.logsLoaded=false; renderSoLop(); };
  $('#slReload').onclick=function(){ SL.logsLoaded=false; tabSoLop(true); };
  $('#slAddSt').onclick=function(){ slStudentModal(null); };
  $('#slAddCls').onclick=function(){ slClassModal(null); };
  $('#slCsv').onclick=slExportCsv;
  if($('#slKpiTrial')) $('#slKpiTrial').onclick=function(){ SL.view='students'; SL.status='trial_need'; SL.cls='all'; renderSoLop(); };
  if($('#slKpiUnpaid')) $('#slKpiUnpaid').onclick=function(){ SL.view='students'; SL.status='unpaid'; SL.cls='all'; renderSoLop(); };

  $$('[data-slview]').forEach(function(b){ b.onclick=function(){ SL.cls=b.dataset.slview; SL.view='students'; renderSoLop(); }; });
  $$('[data-sledc]').forEach(function(b){ b.onclick=function(){ var c=SL.classes.filter(function(x){return x.id===b.dataset.sledc;})[0]; if(c) slClassModal(c); }; });
  $$('[data-sleds]').forEach(function(b){ b.onclick=function(){ var s=SL.students.filter(function(x){return x.id===b.dataset.sleds;})[0]; if(s) slStudentModal(s); }; });
  $$('[data-sltr]').forEach(function(b){ b.onclick=function(){ var s=SL.students.filter(function(x){return x.id===b.dataset.sltr;})[0]; if(s) slTransferModal(s); }; });
  $$('[data-sllv]').forEach(function(b){ b.onclick=function(){ var s=SL.students.filter(function(x){return x.id===b.dataset.sllv;})[0]; if(s) slLeaveModal(s); }; });
  $$('[data-slpay]').forEach(function(b){ b.onclick=function(){ var s=SL.students.filter(function(x){return x.id===b.dataset.slpay;})[0]; if(s) slPayModal(s); }; });
  $$('[data-slmsg]').forEach(function(b){ b.onclick=function(){ var s=SL.students.filter(function(x){return x.id===b.dataset.slmsg;})[0]; if(s) slFeeMsgModal(s); }; });

  if($('#slClsF')) $('#slClsF').onchange=function(){ SL.cls=this.value; renderSoLop(); };
  if($('#slStF')) $('#slStF').onchange=function(){ SL.status=this.value; renderSoLop(); };
}

function slExportCsv(){
  var cols=['id','className','branch','name','dob','parentName','phone','status','monthlyFeeApplied','discountNote','paidMonth','lastPaidDate','trialDate','leaveDate','leaveReason','note'];
  var lines=['\uFEFF'+cols.join(',')];
  (SL.students||[]).forEach(function(s){
    lines.push(cols.map(function(k){ return '"'+String(s[k]||'').replace(/"/g,'""')+'"'; }).join(','));
  });
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv;charset=utf-8;'}));
  a.download='SoLop_IELTS_Hannah_'+slTodayVN().replace(/\//g,'-')+'.csv';
  a.click();
}

  if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js'); }catch(e){} }
  window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); PWA.deferred=e; pwaBar(); });
  window.addEventListener('appinstalled',function(){ PWA.deferred=null; var b=document.getElementById('pwabar'); if(b) b.remove(); toast('Đã cài app IELTS Hannah 🎉 Lần sau con mở từ biểu tượng trên màn hình nhé.'); });
  window.addEventListener('offline',function(){ toast('Con đang mất mạng – kết nối lại rồi làm tiếp nhé.'); });
  setTimeout(pwaBar,2500);
}
function pwaBar(){
  if(!BOOT.standalone || pwaStandalone() || document.getElementById('pwabar')) return;
  try{ var t=Number(localStorage.getItem('pwa_hide')||0); if(t && Date.now()-t<5*864e5) return; }catch(e){}
  if(!PWA.deferred && !pwaIOS() && !isAndroid() && !inAppBrowser()) return; // máy tính chưa hỗ trợ cài → không làm phiền
  var d=document.createElement('div'); d.id='pwabar';
  d.innerHTML='<img src="icon-96.png" alt=""><div class="t"><b>Cài app IELTS Hannah</b><span>Mở nhanh từ màn hình điện thoại, ghi âm ổn định</span></div><button class="btn sm" id="pwago">📲 Cài</button><button class="x" id="pwax" aria-label="Đóng">✕</button>';
  document.body.appendChild(d);
  document.getElementById('pwax').onclick=function(){ try{ localStorage.setItem('pwa_hide',String(Date.now())); }catch(e){} d.remove(); };
  document.getElementById('pwago').onclick=pwaInstall;
}
function pwaInstall(){
  if(PWA.deferred){ PWA.deferred.prompt(); PWA.deferred.userChoice.then(function(){ PWA.deferred=null; }); return; }
  if(inAppBrowser()){ modal('<h3>Mở bằng trình duyệt để cài app</h3><p>Hiện trang đang mở trong Zalo/Messenger nên chưa cài app được.</p><ol class="pwasteps"><li>Bấm <b>⋯</b> hoặc <b>⋮</b> ở góc trên màn hình.</li><li>Chọn <b>Mở bằng trình duyệt</b> ('+(pwaIOS()?'Safari':'Chrome')+').</li><li>Bấm lại nút <b>📲 Cài app</b> trên đầu trang.</li></ol>',[{label:'Đã hiểu',value:true}]); return; }
  if(pwaIOS()){
    var notSafari = /CriOS|EdgiOS|FxiOS|OPiOS/i.test(navigator.userAgent||'');
    if(notSafari){
      modal('<h3>Mở bằng Safari để cài app trên iPhone/iPad</h3><ol class="pwasteps"><li>Chép link <b>hoc.ieltshannah.com/baitap/</b> rồi mở bằng trình duyệt <b>Safari</b>.</li><li>Bấm nút <b>Chia sẻ</b> <span class="pwai">⬆️</span> ở thanh dưới cùng (hoặc góc trên iPad).</li><li>Kéo xuống chọn <b>Thêm vào MH chính</b> (Add to Home Screen) → <b>Thêm</b>.</li></ol>',[{label:'Đã hiểu',value:true}]);
      return;
    }
    modal('<h3>Cài app trên iPhone / iPad</h3><ol class="pwasteps"><li>Bấm nút <b>Chia sẻ</b> <span class="pwai">⬆️</span> ở thanh dưới cùng của Safari (hoặc góc trên phải trên iPad).</li><li>Kéo xuống, chọn <b>Thêm vào MH chính</b> (Add to Home Screen).</li><li>Bấm <b>Thêm</b> ở góc trên phải.</li></ol><p class="muted small">Mở app từ màn hình chính lần đầu, con nhập lại mã học viên 1 lần nhé.</p>',[{label:'Đã hiểu',value:true}]);
    return;
  }
  modal('<h3>Cài app trên Android</h3><ol class="pwasteps"><li><b>Trên Chrome:</b> Bấm <b>⋮</b> ở góc trên phải → chọn <b>Cài đặt ứng dụng</b> hoặc <b>Thêm vào màn hình chính</b> → <b>Cài đặt</b>.</li><li><b>Trên Samsung Internet:</b> Bấm <b>≡</b> ở góc dưới phải → <b>Thêm trang vào</b> → <b>Màn hình chờ</b>.</li></ol><p class="muted small">Sau khi cài xong, con mở từ biểu tượng <b>IELTS Hannah</b> trên màn hình điện thoại để làm bài và ghi âm ổn định nhất.</p>',[{label:'Đã hiểu',value:true}]);
}
pwaInit();

</script>
