<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Bài tập về nhà – IELTS Hannah</title>
<meta name="theme-color" content="#0E7C72">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IELTS Hannah">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F0; --card:#FFFFFF; --ink:#1F2A33; --muted:#66727C; --line:#EDE2D6;
  --brand:#0E7C72; --brand-ink:#FFFFFF; --brand-soft:#D7F1EC;
  --accent:#F0604D; --sun:#F5B83D; --ok:#159947; --ok-soft:#DDF5E5; --bad:#D63A2F; --bad-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(31,42,51,.06),0 6px 20px rgba(31,42,51,.06);
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.top h1{font-size:18px;margin:0;line-height:1.2}
.top small{color:var(--muted);display:block;font-size:13px}
.top .sp{flex:1}
h2{font-size:22px;margin:6px 0 4px;line-height:1.25}
h3{font-size:17px;margin:0 0 8px}
p.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.lvl{border:0;border-radius:var(--r);padding:18px 14px;text-align:left;cursor:pointer;color:#fff;font-weight:700;font-size:17px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow);transition:transform .12s}
.lvl:active{transform:scale(.97)}
.lvl span{font-size:26px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--brand);color:var(--brand-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .1s, filter .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.plain{background:#F3EDE6;color:var(--ink)}
.btn.warn{background:var(--bad-soft);color:var(--bad)}
.btn.accent{background:var(--accent)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:10px}
.btn.lg{padding:14px 24px;font-size:18px;border-radius:14px}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:4px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#F3EDE6;font-size:13px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.sun{background:#FDF0D3;color:#8A5B00}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;background:#F3EDE6;padding:5px;border-radius:14px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.filter button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.filter button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.names{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
.name{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:700;font-size:17px;cursor:pointer;text-align:left}
.name:active{background:var(--brand-soft)}
input[type=text],input[type=search],input[type=date],input[type=password],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{resize:vertical;min-height:90px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
.hw{display:flex;gap:14px;align-items:flex-start}
.hw .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--brand-soft)}
.hw .bd{flex:1;min-width:0}
.hw .tt{font-weight:700;font-size:17px;line-height:1.3}
.fb{background:#FFF6E2;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px}
.sec{border-top:1px dashed var(--line);padding-top:14px;margin-top:14px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.secnum{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.q{margin-bottom:16px}
.q .qt{font-weight:600;margin-bottom:8px}
.q img,.rich img{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:6px 0}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 12px;text-align:left;cursor:pointer;font-weight:600}
.opt.on{border-color:var(--brand);background:var(--brand-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mi{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px;cursor:pointer;font-weight:600;min-height:52px;text-align:center;transition:all .15s}
.mi img{max-height:70px;margin:0 auto}
.mi.sel{border-color:var(--sun);background:#FFF3D6;transform:scale(1.02)}
.mi.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default;opacity:.75}
.mi.wrong{animation:shake .35s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sent{font-size:17px;line-height:2.4;margin-bottom:6px}
.blank{display:inline-block;min-width:84px;border-bottom:2.5px solid var(--brand);margin:0 4px;padding:0 8px;text-align:center;cursor:pointer;border-radius:8px 8px 0 0;line-height:1.6;font-weight:700;vertical-align:baseline}
.blank.empty{color:transparent}
.ordline{min-height:48px;border-bottom:2.5px solid var(--brand);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 2px;margin:6px 0 4px}
.wchip.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.fillw.tiny .blank{min-width:40px;padding:0 4px;margin:0 2px}
.fillw.short .blank{min-width:58px;padding:0 6px}
.blank.act{background:#FFF3D6}
.blank.filled{background:var(--brand-soft);color:var(--brand)}
.blank.over{background:#FFE6A8}
.blank.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.blank.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:#F7F1EA;border-radius:14px;margin-top:8px;position:sticky;bottom:84px;z-index:3}
.wchip{border:0;border-radius:10px;background:#fff;padding:9px 14px;font-weight:700;cursor:grab;box-shadow:0 2px 0 #E3D6C8}
.wchip.used{opacity:.25;pointer-events:none}
.sky{position:relative;height:320px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#BFE8FF 0%,#E8F7FF 60%,#FFF6E5 100%);touch-action:manipulation;user-select:none}
.sky .prompt{position:absolute;left:0;right:0;top:0;padding:10px;text-align:center;font-weight:800;font-size:18px;background:rgba(255,255,255,.85);z-index:2}
.sky .hud{position:absolute;right:10px;top:50px;z-index:2;font-weight:700;font-size:14px;background:rgba(255,255,255,.8);padding:2px 10px;border-radius:999px}
.bub{position:absolute;top:0;padding:10px 16px;border-radius:999px;font-weight:800;font-size:18px;color:#fff;cursor:pointer;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.12);will-change:transform}
.bub.pop{animation:pop .3s forwards}
.bub.no{animation:shake .3s}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.sky .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:3}
.rec{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#F7F1EA;border-radius:14px;padding:12px}
.recbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:22px;cursor:pointer;flex:none;display:grid;place-items:center}
.recbtn.on{animation:pulse 1.2s infinite;background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,58,47,.5)}100%{box-shadow:0 0 0 16px rgba(214,58,47,0)}}
audio{height:40px;max-width:100%}
.wc{font-size:14px;font-weight:700}
.linkitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.linkitem:last-child{border-bottom:0}
.linkitem .t{flex:1;min-width:0;font-weight:600;word-break:break-word}
.chk{width:24px;height:24px;accent-color:var(--ok);flex:none}
.submitbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,248,240,.96);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(6px)}
.submitbar .in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center}
.prog{flex:1;height:10px;background:#EDE2D6;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.result{text-align:center;padding:26px 16px}
.stars{font-size:46px;letter-spacing:6px}
.big{font-size:44px;font-weight:800;line-height:1.1;margin:8px 0}
.overlay{position:fixed;inset:0;background:rgba(31,42,51,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal h3{margin-top:0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.loading{display:grid;place-items:center;padding:60px 0;color:var(--muted)}
.spin{width:34px;height:34px;border:4px solid var(--brand-soft);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse}
.st-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.st-row:last-child{border-bottom:0}
.st-row .n{flex:1;font-weight:600;min-width:0}
.detail{background:#FBF7F2;border-radius:14px;padding:14px;margin:4px 0 12px}
.ans{margin:4px 0;font-size:15px}
.ans .ok{color:var(--ok);font-weight:700}
.ans .bad{color:var(--bad);font-weight:700;text-decoration:line-through}
.writing{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px}
.block{border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;background:#FFFCF9}
.block .bh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.block .bh b{flex:1}
.help{font-size:13px;color:var(--muted);background:#F7F1EA;border-radius:10px;padding:8px 10px;margin:6px 0;white-space:pre-wrap}
.err{color:var(--bad);font-size:14px;font-weight:600;margin-top:6px}
.okmsg{color:var(--ok);font-size:14px;font-weight:600;margin-top:6px}
.addrow{display:flex;flex-wrap:wrap;gap:8px}
.switch{display:flex;align-items:center;gap:10px;font-weight:600;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--brand)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty .e{font-size:40px}
/* loa, ô màu, emoji, nói */
.spk{border:0;background:var(--brand);color:#fff;border-radius:999px;width:40px;height:40px;font-size:19px;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle;margin:0 4px;box-shadow:0 2px 0 rgba(0,0,0,.15);flex:none}
.spk:active{transform:scale(.92)}
.q .qt .spk{width:56px;height:56px;font-size:26px}
.opt .spk{width:34px;height:34px;font-size:16px}
.sw{display:inline-block;width:46px;height:46px;border-radius:50%;border:2px solid rgba(0,0,0,.15);vertical-align:middle}
.opt.pic{text-align:center;font-size:40px;line-height:1.2;padding:10px 6px;display:flex;align-items:center;justify-content:center;gap:8px}
.opt.pic .lt{font-size:15px;color:var(--muted);font-weight:700}
.mi .sw{width:38px;height:38px}
.shp{vertical-align:middle}
table.sc{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
table.sc th,table.sc td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.sc th{background:#F7F1EA;font-size:13px;position:sticky;top:0}
table.sc .stk{position:sticky;left:0;background:#fff;z-index:1;width:36px}
table.sc .stk2{position:sticky;left:36px;background:#fff;z-index:1;text-align:left;font-weight:600;max-width:160px;white-space:normal;min-width:120px}
table.sc th.stk,table.sc th.stk2{background:#F7F1EA;z-index:2}
table.sc td.cl{cursor:pointer;font-weight:700}
.opts.picopts{grid-template-columns:repeat(3,1fr)}
.qt.picq{font-size:34px;display:flex;align-items:center;gap:6px}
@media (max-width:520px){ .opts.picopts{grid-template-columns:repeat(3,1fr)} }
.mi.pic{font-size:34px}
.instr{font-size:14px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.instr b{color:var(--ink)}
.say{background:#F7F1EA;border-radius:14px;padding:12px;margin-bottom:12px}
.say .tg{font-weight:700;font-size:18px;margin:6px 0}
.say .tg .w{padding:0 2px;border-radius:4px}
.say .tg .w.ok{color:var(--ok);background:var(--ok-soft)}
.say .tg .w.no,.wm.no{color:var(--bad);background:var(--bad-soft)}
.say .tg .w.near,.wm.near{color:#B45309;background:#FFEBD2}
.wm{display:inline-block;padding:1px 6px;border-radius:6px;margin:1px 1px;font-weight:600}
.wm.ok{color:var(--ok);background:var(--ok-soft)}
.legend{font-size:12px;color:var(--muted)} .legend .wm{font-size:12px}
.say .heard{font-size:14px;color:var(--muted)}
.say .row{gap:12px}
.stars-s{font-size:22px;letter-spacing:2px}
.bub .sw{width:30px;height:30px;border:2px solid #fff}
.bub.pic{font-size:30px;padding:6px 12px}
.clsbox{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.clsbox label{display:flex;align-items:center;gap:6px;background:#F7F1EA;border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px;cursor:pointer}
@media (max-width:520px){
  .wrap{padding:12px 12px 120px}
  h2{font-size:20px}
  .opts{grid-template-columns:1fr}
  .sky{height:300px}
}
.nextup{box-shadow:0 0 0 3px #FFB020;border-radius:12px;transition:box-shadow .3s}
/* đăng nhập mã lớp, nhiệm vụ web khác, ảnh */
.login{max-width:420px;margin:18px auto}
.pinin{font-size:26px;letter-spacing:8px;text-align:center;font-weight:800}
.extrow{display:flex;align-items:center;gap:12px;background:#F7F1EA;border-radius:14px;padding:12px;margin-bottom:10px}
.extrow .tk{width:30px;height:30px;border-radius:9px;border:2px solid #CDBFAF;display:grid;place-items:center;flex:none;font-weight:800;color:#fff;transition:all .2s}
.extrow.done .tk{background:var(--ok);border-color:var(--ok)}
.extrow .t{flex:1;min-width:0}
.thumb{max-width:180px;max-height:180px;border-radius:10px;display:block;margin-top:8px;border:1px solid var(--line)}
.partbar{height:6px;background:#EDE2D6;border-radius:99px;overflow:hidden;margin-top:6px;max-width:220px}
.partbar i{display:block;height:100%;background:var(--ok)}
.pinrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pinrow:last-child{border-bottom:0}
.pinrow .n{flex:1;min-width:160px;font-weight:700}
.pinrow input{width:96px;text-align:center;font-weight:800;letter-spacing:3px}
td.part{background:#FFF3D6;color:#8A5B00}

/* ---- Nghe – chép chính tả ---- */
.ncov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ncov .in{max-width:760px;margin:0 auto;padding:12px 16px 120px}
.nchead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2;border-bottom:1px solid var(--line);margin-bottom:12px}
.nchead .tt{flex:1;font-weight:800;line-height:1.25}.nchead .tt small{display:block;font-weight:500;color:var(--muted)}
.ncsteps{display:flex;gap:6px;margin:0 0 14px}.ncsteps span{flex:1;text-align:center;font-size:12.5px;font-weight:700;padding:7px 4px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--muted)}
.ncsteps span.on{background:var(--brand);border-color:var(--brand);color:#fff}.ncsteps span.dn{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-soft)}
.nctimer{font-size:40px;font-weight:800;letter-spacing:1px;color:var(--brand);text-align:center;font-variant-numeric:tabular-nums}
.nctimer.end{color:var(--accent)}
.ncv{display:grid;grid-template-columns:40px 1fr;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.ncv .en{font-weight:700}.ncv .ipa{color:var(--muted);font-size:13.5px}.ncv .vi{grid-column:2;color:#3b4a55}
.ncspk{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand-soft);color:var(--brand);cursor:pointer;font-size:16px}
.ncrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ncslot{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px}
.ncslot .m{flex:1;min-width:0}.ncslot .d{min-width:130px;min-height:40px;border:2px dashed #cfd8dc;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px 8px;font-weight:700;cursor:pointer;text-align:center}
.ncslot .d.full{border-style:solid;border-color:var(--brand);background:var(--brand-soft)}
.ncslot.ok .d{border-color:var(--ok);background:var(--ok-soft)}.ncslot.bad .d{border-color:var(--bad);background:var(--bad-soft)}
.ncbank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;padding:10px;border-radius:12px;background:#FFFCF8;border:1px solid var(--line);min-height:56px}
.ncchip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:grab;user-select:none}
.ncchip.sel{background:var(--sun);border-color:var(--sun)}
.ncq{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px}
.ncq input[type=text]{width:100%;margin-top:6px}
.ncq.ok{border-color:var(--ok);background:var(--ok-soft)}.ncq.bad{border-color:var(--bad);background:var(--bad-soft)}

.fchint{position:absolute;bottom:12px}.fctag{position:absolute;top:-12px;left:50%;transform:translateX(-50%);z-index:2;background:var(--sun,#FFE9A8);padding:4px 12px;border-radius:20px;font-size:13px;font-weight:700;white-space:nowrap}
.fcbtns{display:flex;gap:10px;width:100%;max-width:440px;margin-top:18px}.fcbtns .btn{flex:1}.fcno{background:#FDE3DE!important;color:#C0392B!important}.fcyes{background:#DDF3E6!important;color:#1E7D45!important}
.fcdone{text-align:center;max-width:460px}.fcdone .confetti{font-size:34px;letter-spacing:6px}.flame.big{font-size:80px}.flame.up{animation:fcpop .8s ease}.fcup{color:var(--accent);font-weight:700}
/* ---------- Phụ huynh · Báo cáo · Tổng quan (giai đoạn 4) ---------- */
.phmonth{border:2px solid #F5DFA8;background:linear-gradient(180deg,#FFFBF0,#fff)}.phmonth pre{white-space:pre-wrap;font-family:inherit;font-size:14.5px;line-height:1.55;margin:8px 0 0}.phscore{display:flex;align-items:center;gap:10px;margin:10px 0 4px}.phscore b{font-size:36px;color:var(--accent);line-height:1}.phscore small{font-size:18px;color:var(--muted)}
.phhead{display:flex;gap:14px;align-items:center}.phline{margin:6px 0}.phline.bad{color:var(--bad)}.phline.ok{color:#1E7D45}
.phrep{border-top:1px solid var(--line);padding:8px 0}.phrep summary{cursor:pointer}.phrep pre,.rppre{white-space:pre-wrap;font-family:inherit;font-size:14px;background:#FBF7F2;border-radius:10px;padding:10px;margin:8px 0 0}
.ovk{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.ovk>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.ovk b{display:block;font-size:24px;color:var(--brand);line-height:1.15}.ovk span{font-size:12.5px;color:var(--muted)}.ovk .bad b{color:var(--bad)}
.ovk small,.ovg small.up,.ovg small.down{font-size:12px;margin-left:4px}small.up{color:#1E7D45}small.down{color:var(--bad)}
@media (max-width:600px){.ovk{grid-template-columns:repeat(2,1fr)}}
.ovg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}.ovg>div{background:#FBF7F2;border-radius:10px;padding:8px 10px}.ovg>div>span:first-child{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.ovatt{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}.ovp{display:flex;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid var(--line);cursor:pointer}.ovp span:first-child{font-weight:600}.ovp small{flex:1;color:var(--bad)}
.rprow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.rprow .n{flex:1;min-width:0}.rpbtn{display:flex;gap:6px;flex:none}
/* ---------- Đua vịt + chia nhóm ---------- */
.funbtns{display:flex;gap:10px;margin:-4px 0 14px;flex-wrap:wrap}.funbtns .btn{flex:1;min-width:150px}
.funv{background:#F4FBFF}.dkwrap{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:10px 14px 14px;max-width:1100px;width:100%;margin:0 auto;box-sizing:border-box}
.dkwin{text-align:center;font-size:18px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dkname-big{font-size:34px;font-weight:800;color:var(--accent);line-height:1.2}
.dktrack{flex:1;overflow:auto;background:linear-gradient(180deg,#BFE6F7,#8FD0EE);border-radius:16px;padding:6px 8px}
.dklane{display:flex;align-items:center;gap:8px;border-bottom:2px dashed rgba(255,255,255,.7);padding:3px 0;min-height:30px}
.dkname{width:120px;flex:none;font-size:13px;font-weight:700;color:#0b3a52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dkrun{flex:1;position:relative;height:28px}.dk{position:absolute;left:0;top:0;font-size:24px;line-height:28px;will-change:transform;transform:scaleX(-1)}
.dkflag{font-size:18px}.dklane.win{background:rgba(255,236,150,.85);border-radius:10px}.dklane.win .dkname{color:var(--accent)}
.dkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.gpwrap{max-width:1100px;margin:0 auto;padding:14px 16px 40px}.gpk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-weight:700}
.gpk button[data-k]{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:18px;font-weight:800;cursor:pointer}.gpk button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.gpgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.gp{background:#fff;border-radius:16px;border-top:6px solid var(--c);box-shadow:var(--shadow);padding:12px 14px}.gp h3{margin:0 0 8px;color:var(--c)}.gp h3 small{color:var(--muted);font-weight:600}
.gpn{padding:6px 0;border-bottom:1px solid var(--line);font-weight:600;animation:fcpop .45s ease both}
#pwabar{position:fixed;left:10px;right:10px;bottom:12px;z-index:60;max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(31,42,51,.18);display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;animation:fcpop .4s ease}
#pwabar img{width:44px;height:44px;border-radius:10px;border:1px solid var(--line)}#pwabar .t{flex:1;min-width:0}#pwabar .t b{display:block;font-size:15px}#pwabar .t span{font-size:12.5px;color:var(--muted)}
#pwabar .x{border:0;background:transparent;font-size:18px;color:var(--muted);padding:6px;cursor:pointer}.pwasteps{padding-left:20px;line-height:1.7}.pwai{font-size:18px}
@media (display-mode: standalone){body{padding-top:env(safe-area-inset-top)}}

var FC_COLORS={red:'#E53935',green:'#43A047',blue:'#1E88E5',yellow:'#FDD835',orange:'#FB8C00',pink:'#F48FB1',purple:'#8E24AA',brown:'#795548',black:'#212121',white:'#FFFFFF',gray:'#9E9E9E',grey:'#9E9E9E'};
var FC_SHAPES={circle:'⚪',square:'🟥',triangle:'🔺',star:'⭐',heart:'❤️',rectangle:'▬',oval:'🥚',diamond:'🔷'};
function fcPic(e){
  e=String(e||''); if(!e) return '';
  var m=e.match(/^color:(\w+)/); if(m) return '<div class="fcpic"><span class="fcdot" style="background:'+(FC_COLORS[m[1]]||m[1])+'"></span></div>';
  m=e.match(/^shape:(\w+)/); if(m) return '<div class="fcpic">'+(FC_SHAPES[m[1]]||'🔷')+'</div>';
  if(/^\d+$/.test(e)) return '<div class="fcpic fcnum">'+esc(e)+'</div>';
  return '<div class="fcpic">'+esc(e)+'</div>';
}
function fcSay(w){ return String(w||'').replace(/^\d+\s*–\s*/,''); }
function fcWeek(days){
  var has={}; (days||[]).forEach(function(d){ has[d]=1; });
  var out='', now=new Date(), names=['CN','T2','T3','T4','T5','T6','T7'];
  for(var i=6;i>=0;i--){
    var d=new Date(now.getTime()-i*864e5), k=new Date(d.getTime()+7*3600e3).toISOString().slice(0,10);
    var dd=new Date(k+'T00:00:00Z');
    out+='<div class="fcday'+(has[k]?' on':'')+(i===0?' today':'')+'"><span>'+(has[k]?'🔥':'·')+'</span><small>'+(i===0?'Nay':names[dd.getUTCDay()])+'</small></div>';
  }
  return '<div class="fcweek">'+out+'</div>';
}

    var task;

    else if(d.doneToday && d.extra) task='<div class="card fctask done"><div class="big">✅ Hôm nay con học xong rồi!</div><p class="muted">Giỏi lắm! Mai quay lại để giữ chuỗi 🔥 nhé.</p><button class="btn plain" id="fcgo">Ôn thêm 10 thẻ</button></div>';
    else task='<div class="card fctask">'+(d.doneToday?'<div class="big">✅ Hôm nay đã tính ngày học</div><p class="muted">Con vẫn còn thẻ đến hạn, ôn tiếp cho nhớ lâu nhé.</p>':'<div class="big">Hôm nay: '+d.cards.length+' thẻ</div><p class="muted">'+(nOld?nOld+' thẻ cần ôn lại':'')+(nOld&&nNew?' · ':'')+(nNew?nNew+' từ mới ✨':'')+(d.extra?'Ôn thêm cho nhớ lâu':'')+' · khoảng '+Math.max(2,Math.round(d.cards.length*0.15))+' phút</p>')+
      '<button class="btn lg" id="fcgo" style="width:100%">'+(d.doneToday?'Ôn tiếp →':'Bắt đầu ôn →')+'</button></div>';
    var bd=d.badges.map(function(b){ return '<div class="fcbadge'+(b.got?' got':'')+'" title="'+esc(b.desc)+'"><div class="i">'+b.icon+'</div><b>'+esc(b.name)+'</b><small>'+esc(b.desc)+'</small></div>'; }).join('');
    var nGot=d.badges.filter(function(b){ return b.got; }).length;
    var bo=d.board.top.length?'<div class="card"><h3>🏅 Bảng xếp hạng lớp '+esc(S.student.group||'')+'</h3>'+d.board.top.map(function(r){
        return '<div class="fcrank'+(r.me?' me':'')+'"><span class="n">'+(r.rank<=3?['🥇','🥈','🥉'][r.rank-1]:r.rank)+'</span><span class="nm">'+esc(r.name)+(r.me?' (con)':'')+'</span><span class="chip sun">🔥 '+r.streak+'</span><span class="chip">📚 '+r.learned+'</span></div>'; }).join('')+
      (d.board.myRank&&d.board.myRank>10?'<p class="muted small" style="margin:8px 0 0">Con đang đứng thứ '+d.board.myRank+'/'+d.board.total+'. Cố lên!</p>':'')+'<p class="muted small" style="margin:8px 0 0">Xếp theo chuỗi ngày học, rồi số từ đã thuộc.</p></div>':'';
    box.innerHTML='<div class="card fchero"><div class="flame'+(d.streak?'':' off')+'">🔥</div><div style="flex:1"><div class="sn">'+d.streak+' <span>ngày liền</span></div><div class="muted small">Kỷ lục: '+d.best+' ngày · Đã thuộc <b>'+d.learned+'</b>/'+d.deckSize+' từ</div></div></div>'+
      fcWeek(d.days)+task+
      '<div class="card"><h3>🎖️ Huy hiệu <span class="muted small">('+nGot+'/'+d.badges.length+')</span></h3><div class="fcbadges">'+bd+'</div></div>'+bo+
      '<p class="muted small">Ôn từ hằng ngày ở ngay đầu mục <b>Cần làm</b>. Mỗi ngày ôn xong thẻ <b>hoặc</b> nộp 1 bài tập là giữ được chuỗi 🔥. Từ nhớ rồi sẽ lâu lâu mới gặp lại; từ quên sẽ gặp lại ngày mai.</p>';

}
function renderFCMini(box){
  if(!box) return;
  box.innerHTML='<div class="card fcmini"><div class="flame off">🔥</div><div style="flex:1"><b>Ôn từ hôm nay</b><div class="muted small">Đang tải…</div></div></div>';
  api('api_fcToday', S.student.id).then(function(d){
    S.fc=d;
    if(!d.deckSize){ box.innerHTML=''; return; }
    var n=d.cards.length, nNew=d.cards.filter(function(c){ return c.isNew; }).length;
    if(d.doneToday && d.extra){
      box.innerHTML='<div class="card fcmini done"><div class="flame">🔥</div><div style="flex:1"><b>✅ Hôm nay con đã ôn từ</b><div class="muted small">Chuỗi '+d.streak+' ngày liền · đã thuộc '+d.learned+' từ</div></div><button class="btn sm plain" id="fcm">Ôn thêm</button></div>';
    } else {
      box.innerHTML='<div class="card fcmini'+(d.doneToday?' done':'')+'"><div class="flame'+(d.streak?'':' off')+'">🔥</div><div style="flex:1"><b>'+(d.doneToday?'✅ Đã tính ngày học · còn '+n+' thẻ':'🃏 Ôn từ hôm nay: '+n+' thẻ')+'</b><div class="muted small">'+(d.streak?'Chuỗi '+d.streak+' ngày liền':'Bắt đầu chuỗi ngày học nào!')+(nNew?' · '+nNew+' từ mới ✨':'')+' · ~'+Math.max(2,Math.round(n*0.15))+' phút</div></div><button class="btn sm" id="fcm">Ôn ngay →</button></div>';
    }
    $('#fcm').onclick=function(){ fcPlay(d.cards, box); };
  }).catch(function(){ box.innerHTML=''; });
}
function fcPlay(cards, box){
  if(!cards||!cards.length) return;
  var lv=(S.fc&&S.fc.level)||'', kid=lv==='superkids';
  var q=cards.filter(function(c){ return !c.isNew; }).sort(function(){ return Math.random()-0.5; });
  // từ mới chen vào giữa: học trước (xem cả 2 mặt), rồi kiểm tra lại cuối lượt
  cards.filter(function(c){ return c.isNew; }).forEach(function(c,i){ q.splice(Math.min(q.length, i*3+1),0,{c:c,learn:true}); });
  q=q.map(function(x){ return x.c?x:{c:x}; });
  cards.filter(function(c){ return c.isNew; }).forEach(function(c){ q.push({c:c,check:true}); });
  var first={}, results=[], run=0, maxRun=0, total=q.length, done=0, flipped=false;
  var L=$('#layer');
  L.innerHTML='<div class="pfv fcplay"><div class="pfbar"><button class="btn sm plain" id="fcx">✕</button><div class="fcprog"><i id="fcbar"></i></div><b id="fccnt"></b></div><div class="fcstage" id="fcst"></div></div>';
  var quit=function(){
    if(!results.length){ L.innerHTML=''; return; }
    modal('<h3>Dừng ôn?</h3><p>Em lưu '+results.length+' thẻ con đã ôn rồi thoát nhé.</p>',[{label:'Ôn tiếp',cls:'plain',value:false},{label:'Lưu & thoát',value:true}]).then(function(ok){ if(ok) save(); });
  };
  $('#fcx').onclick=quit;
  var record=function(c,ok){
    var k=c.w.toLowerCase();
    if(!(k in first)){ first[k]=ok; results.push({w:c.w,ok:ok}); }
    if(ok){ run++; if(run>maxRun) maxRun=run; } else run=0;
  };
  var show=function(){
    if(!q.length){ save(); return; }
    var it=q[0], c=it.c; flipped=false;
    $('#fcbar').style.width=Math.round(done/Math.max(1,total)*100)+'%';
    $('#fccnt').textContent=(done+1)+'/'+total;
    // Mặt trước: hình + tiếng Việt · Mặt sau: hình + tiếng Anh
    var front=fcPic(c.e)+(c.vi?'<div class="fcvi">'+esc(c.vi)+'</div>':'')+'<div class="fclang">🇻🇳 Tiếng Việt</div>';
    var back=fcPic(c.e)+'<div class="fcw">'+esc(c.w)+'</div><button class="btn sm soft" id="fcsp">🔊 Nghe lại</button><div class="fclang">🇬🇧 Tiếng Anh</div>';
    $('#fcst').innerHTML='<div class="fccard'+(flipped?' flip':'')+'" id="fccard">'+(it.learn?'<span class="fctag">✨ Từ mới – đọc theo nhé</span>':it.check?'<span class="fctag">🔁 Kiểm tra từ mới</span>':'')+
      '<div class="fcface fcfront">'+front+'<div class="muted small fchint">Chạm để lật thẻ</div></div><div class="fcface fcback">'+back+'<div class="muted small fchint">Chạm để xem lại mặt tiếng Việt</div></div></div>'+
      '<div class="fcbtns" id="fcbtns">'+(it.learn?'<button class="btn lg" id="fcnext" style="flex:1">Con đọc theo rồi ✓</button>':'<button class="btn lg plain" id="fcflip" style="flex:1">Lật thẻ</button>')+'</div>';
    var answered=false;
    var toggle=function(){ // lật qua lại 2 mặt
      var el=$('#fccard'); if(!el) return;
      var on=!el.classList.contains('flip'); el.classList.toggle('flip',on); if(on) speak(fcSay(c.w));
    };
    var flip=function(){
      if(flipped){ toggle(); return; } flipped=true;
      $('#fccard').classList.add('flip'); speak(fcSay(c.w));
      if(it.learn) return;
      $('#fcbtns').innerHTML='<button class="btn lg fcno" id="fcno">😕 Chưa nhớ</button><button class="btn lg fcyes" id="fcyes">😊 Nhớ rồi</button>';
      $('#fcno').onclick=function(){ record(c,false); q.shift(); q.push({c:c,again:true}); total++; done++; show(); };
      $('#fcyes').onclick=function(){ record(c,true); q.shift(); done++; show(); };
    };
    $('#fccard').onclick=flip;
    if(it.learn){ var cur=c; setTimeout(function(){ if(q[0]&&q[0].c===cur&&!flipped) flip(); },1400); $('#fcnext').onclick=function(){ q.shift(); done++; show(); }; }
    else $('#fcflip').onclick=flip;
    $('#fcsp').onclick=function(ev){ ev.stopPropagation(); speak(fcSay(c.w)); };
  };
  var save=function(){
    $('#fcst').innerHTML='<div class="loading"><div><div class="spin"></div>Đang lưu kết quả…</div></div>'; $('#fcbtns')&&($('#fcbtns').innerHTML='');
    api('api_fcSave', S.student.id, results, maxRun).then(function(r){
      var nb=(r.newBadges||[]).map(function(b){ return '<div class="fcbadge got pop"><div class="i">'+b.icon+'</div><b>'+esc(b.name)+'</b><small>'+esc(b.desc)+'</small></div>'; }).join('');
      $('#fcst').innerHTML='<div class="fcdone"><div class="confetti">🎉✨🎊</div><div class="flame big'+(r.up?' up':'')+'">🔥</div><h2>'+r.streak+' ngày liền!</h2>'+
        '<p>Con nhớ <b>'+r.ok+'/'+r.total+'</b> thẻ ngay lần đầu · đã thuộc <b>'+r.learned+'</b> từ</p>'+(r.up?'<p class="fcup">Chuỗi ngày học tăng lên rồi! Mai nhớ quay lại nhé 💪</p>':'')+
        (nb?'<h3>🎖️ Huy hiệu mới!</h3><div class="fcbadges">'+nb+'</div>':'')+
        '<button class="btn lg" id="fcok" style="margin-top:16px;min-width:200px">Xong</button></div>';
      $('#fcbar').style.width='100%';
      $('#fcok').onclick=function(){ L.innerHTML=''; if(box&&document.body.contains(box)) (box.id==='fcmini'?renderFCMini(box):renderFC(box)); };
    }).catch(function(e){
      $('#fcst').innerHTML='<div class="card err" style="margin:20px">'+esc(e.message||e)+'<br><button class="btn" id="fcre" style="margin-top:10px">Thử lưu lại</button></div>';
      $('#fcre').onclick=save;
    });
  };
  show();
}

/* ================= Đua vịt gọi khảo bài + Chia nhóm ngẫu nhiên (tab 👧 Học viên) ================= */
var FUN={called:{}};
function funNames(){
  var hit=(T.stCache||{})[T.stCls]; if(!hit) return [];
  return hit.list.filter(function(s){ return s.active; }).map(function(s){ return s.name; });
}
function funShuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function shortName(n){ var p=String(n).trim().split(/\s+/); return p.length>2?p.slice(-2).join(' '):n; }

/* ----- Đua vịt ----- */
function duckRace(){
  var all=funNames(); if(!all.length){ toast('Lớp chưa có học viên'); return; }
  var cls=T.stCls, called=FUN.called[cls]=FUN.called[cls]||[];
  var L=$('#layer');
  var render=function(){
    var skip=$('#dkskip')?$('#dkskip').checked:true;
    var pool=all.filter(function(n){ return !skip || called.indexOf(n)<0; });
    if(!pool.length){ called.length=0; pool=all.slice(); toast('Cả lớp đã được gọi – bắt đầu vòng mới!'); }
    var lanes=funShuffle(pool);
    L.innerHTML='<div class="pfv funv"><div class="pfbar"><button class="btn sm plain" id="dkx">✕ Đóng</button><b>🦆 Đua vịt – '+esc(cls)+'</b><span class="muted small" style="margin-left:auto">'+pool.length+' bạn</span></div>'+
      '<div class="dkwrap"><div class="dkwin" id="dkwin">Bấm <b>Bắt đầu</b> để thả vịt! 🏁</div><div class="dktrack" id="dktrack">'+
      lanes.map(function(n,i){ var sn=shortName(n), dup=lanes.filter(function(x){ return shortName(x)===sn; }).length>1; return '<div class="dklane"><span class="dkname" title="'+esc(n)+'">'+esc(dup?n:sn)+'</span><div class="dkrun"><span class="dk" data-i="'+i+'">🦆</span></div><span class="dkflag">🏁</span></div>'; }).join('')+'</div>'+
      '<div class="dkbar"><label class="switch small"><input type="checkbox" id="dkskip" '+(skip?'checked':'')+'> Bỏ qua bạn đã được gọi'+(called.length?' ('+called.length+')':'')+'</label><button class="btn lg" id="dkgo">🏁 Bắt đầu</button></div></div></div>';
    $('#dkx').onclick=function(){ L.innerHTML=''; };
    $('#dkskip').onchange=render;
    $('#dkgo').onclick=function(){ race(lanes); };
  };
  var race=function(lanes){
    var btn=$('#dkgo'); btn.disabled=true; $('#dkskip').disabled=true;
    var ducks=$$('.dk',L), n=ducks.length, pos=[], sp=[], winner=-1, t0=performance.now();
    var track=$('.dkrun',L), W=track.clientWidth-34;
    for(var i=0;i<n;i++){ pos[i]=0; sp[i]=0.6+Math.random()*0.5; }
    var lucky=Math.floor(Math.random()*n); // bạn được gọi, chọn ngẫu nhiên công bằng
    $('#dkwin').innerHTML='Vịt đang chạy… 🦆💨';
    var step=function(now){
      var el=(now-t0)/1000, done=false;
      for(var i=0;i<n;i++){
        if(Math.random()<0.08) sp[i]=0.45+Math.random()*0.7;   // tăng tốc / chững lại cho vui
        var boost=(i===lucky && el>3.2)?0.55:0;                  // về cuối, vịt may mắn bứt lên
        var cap=(i!==lucky && el>2.5)?0.93:1;                    // các vịt khác không vượt vạch trước
        pos[i]=Math.min(W*cap, pos[i]+(sp[i]+boost)*W/420);
        ducks[i].style.transform='translateX('+pos[i]+'px) scaleX(-1)'+(Math.floor(now/120+i)%2?' rotate(-6deg)':' rotate(6deg)');
        if(i===lucky && pos[i]>=W) done=true;
      }
      if(!done && el<9) requestAnimationFrame(step);
      else finish(lucky);
    };
    var finish=function(i){
      var name=lanes[i]; called.push(name);
      ducks[i].parentNode.parentNode.classList.add('win');
      $('#dkwin').innerHTML='<div class="confetti">🎉✨🎊</div><div class="dkname-big">'+esc(name)+'</div><div class="muted">lên khảo bài nhé! 💪</div>';
      btn.disabled=false; btn.textContent='🔁 Đua tiếp'; btn.onclick=render; $('#dkskip').disabled=false;
    };
    requestAnimationFrame(step);
  };
  render();
}

/* ----- Chia nhóm ----- */
function splitGroups(){
  var all=funNames(); if(!all.length){ toast('Lớp chưa có học viên'); return; }
  var cls=T.stCls, L=$('#layer'), k=FUN.k||4;
  var draw=function(){
    var sh=funShuffle(all), g=[]; for(var i=0;i<k;i++) g.push([]);
    sh.forEach(function(n,i){ g[i%k].push(n); });
    FUN.last=g;
    var colors=['#0E7C72','#F0604D','#7B57E0','#E8A317','#0B6E8E','#B4447A'];
    L.innerHTML='<div class="pfv funv"><div class="pfbar"><button class="btn sm plain" id="gpx">✕ Đóng</button><b>👥 Chia nhóm – '+esc(cls)+'</b><span class="muted small" style="margin-left:auto">'+all.length+' bạn</span></div>'+
      '<div class="pfscroll"><div class="gpwrap"><div class="gpk">Số nhóm: '+[2,3,4,5,6].map(function(x){ return '<button class="'+(x===k?'on':'')+'" data-k="'+x+'">'+x+'</button>'; }).join('')+
      '<button class="btn sm" id="gpre">🔀 Chia lại</button><button class="btn sm plain" id="gpcp">📋 Chép</button></div>'+
      '<div class="gpgrid g'+k+'">'+g.map(function(m,i){ return '<div class="gp" style="--c:'+colors[i]+'"><h3>Nhóm '+(i+1)+' <small>('+m.length+')</small></h3>'+m.map(function(n,j){ return '<div class="gpn" style="animation-delay:'+(j*60+i*30)+'ms">'+esc(n)+'</div>'; }).join('')+'</div>'; }).join('')+'</div></div></div></div>';
    $('#gpx').onclick=function(){ L.innerHTML=''; };
    $('#gpre').onclick=draw;
    $$('[data-k]',L).forEach(function(b){ b.onclick=function(){ k=FUN.k=+b.dataset.k; draw(); }; });
    $('#gpcp').onclick=function(){ copyText('👥 Chia nhóm lớp '+cls+'\n\n'+g.map(function(m,i){ return 'Nhóm '+(i+1)+': '+m.join(', '); }).join('\n')); };
  };
  draw();
}

function startStudent(){
  var ma=BOOT.ma||'';
  if(!ma){ try{ var m=location.search.match(/[?&]ma=([^&]+)/); if(m) ma=decodeURIComponent(m[1]); }catch(e){} }
  if(ma){
    BOOT.ma='';
    try{ if(BOOT.standalone && history.replaceState) history.replaceState(null,'',location.pathname); }catch(e){}
    loginByCode(ma);
    return;
  }
  var saved = store('hw_student');
  if (saved) {
    try { var st = JSON.parse(saved); if (st && st.t) { openHome(st.t); return; } } catch(e){}
    store('hw_student', null);
  }
  loginCode();
}
function loginByCode(code, btn){
  if(!btn) loading('Đang đăng nhập…');
  return api('api_loginCode', code).then(function(r){
    store('hw_student', JSON.stringify({t:r.ticket, name:r.name, cls:r.cls}));
    store('hw_code', String(code).toUpperCase());
    S.tab='todo'; openHome(r.ticket);
  }).catch(function(e){ loginCode((e&&e.message)||String(e), code); });
}

  order.sort(function(a,b){ return a.localeCompare(b,'vi'); });

    return (order.length>1||g?'<h3 class="grp" style="margin:18px 0 10px">'+esc(g||'Khác')+'</h3>':'')+

function workDraftKey(aid){ return (S.student&&S.student.id)?('hw_work_'+S.student.id+'_'+aid):''; }
function saveWorkDraft(){
  if(!W || !W.a || !S.student || S.student.id==='preview') return;

    store(k, JSON.stringify({answers:W.answers, linksDone:W.linksDone, t0:W.t0, at:Date.now()}));
  }catch(e){}
}
function loadWorkDraft(aid){
  try{
    var k=workDraftKey(aid), raw=k?store(k):null;
    if(!raw) return null;
    var d=JSON.parse(raw);
    if(!d || (d.at && Date.now()-d.at>7*864e5)) return null;
    return d;
  }catch(e){ return null; }
}
function clearWorkDraft(aid){
  try{ var k=workDraftKey(aid); if(k) store(k, null); }catch(e){}
}

function openAssignment(id){
  loading('Đang mở bài…');
  api('api_getAssignment', id, S.student.id).then(function(r){
    var a=r.assignment;
    prefetchTTS(ttsTextsOf(a));
    if(S.student && S.student.id!=='preview') store('hw_open_'+S.student.id, id);
    var draft = loadWorkDraft(id);

    var linksDone = a.links.map(function(){ return false; });
    var restored = false;
    if(draft){
      if(Array.isArray(draft.answers) && draft.answers.length===a.activities.length){
        answers = draft.answers;

      }

        linksDone = draft.linksDone;
        if(linksDone.some(Boolean)) restored = true;

    W = { a:a, prev:r.previous, ext:r.ext||{}, answers:answers, linksDone:linksDone, rec:{} , ui:{}, t0:(draft&&draft.t0)||Date.now() };

function isDone(i){
  var act=W.a.activities[i], ans=W.answers[i];
  if(act.type==='mcq') return !!ans && act.items.every(function(_,k){ return ans[k]!=null; });
  if(act.type==='fill') return !!ans && ans.every(function(r){ return r.every(function(w){ return !!w; }); });
  if(act.type==='match'||act.type==='flying') return !!ans && ans.done;
  if(act.type==='speaking') return act.items.every(function(_,k){ return !!W.rec[i+'_'+k]; });
  if(act.type==='writing') return !!ans && (ans.text||'').trim().length>0;
  if(act.type==='order') return !!ans && act.items.every(function(_,k){ return !!String(ans[k]||'').trim(); });
  if(act.type==='typein') return !!ans && act.items.every(function(_,k){ return !!String(ans[k]||'').trim(); });
  if(act.type==='say') return !!ans && ans.tried.every(function(x){ return x; });
  if(act.type==='photo') return act.items.every(function(_,k){ return !!W.rec[i+'_'+k]; });
  if(act.type==='dict') return !!(ans&&ans.done) || !!(W.prev&&W.prev.actScores&&W.prev.actScores[i]!=null);
  if(isExt(act)) return (act.items||[]).every(function(it){ return !!(W.ext||{})[extApp(act.type)+'|'+it.ref]; });
  return true;
}
/* Số phần đã làm (không tính nhiệm vụ trên web khác – phần đó máy chủ tự biết) */
function partsDoneLocal(){
  var d=0; W.a.activities.forEach(function(act,i){ if(!isExt(act) && isDone(i)) d++; });
  if(!W.a.activities.length) W.linksDone.forEach(function(x){ if(x) d++; });
  return d;
}
function updateProgress(){
  saveWorkDraft();
  var n=W.a.activities.length+W.a.links.length; if(!n) return;
  var d=0; W.a.activities.forEach(function(_,i){ if(isDone(i)) d++; }); W.linksDone.forEach(function(x){ if(x) d++; });
  var pg=$('#pg'); if(pg) pg.style.width=Math.round(d/n*100)+'%';
}

/* Trắc nghiệm */
function mountMcq(act,i,el){

/* Nối từ */
function mountMatch(act,i,el){
  var pairs=act.pairs, n=pairs.length;
  var st = W.ui[i] = { order: shuffle(pairs.map(function(_,k){return k;})), matched:{}, mistakes:{}, selL:null, selR:null };
  W.answers[i] = {correct:0,total:n,done:false};
  el.innerHTML = '<p class="instr">Tap a box on the left, then tap its match on the right.<br><i>Chạm 1 ô bên trái rồi chạm ô đúng bên phải.</i></p><div class="match"><div class="col">'+
    pairs.map(function(p,k){ return '<div role="button" tabindex="0" class="mi rich'+(isPic(p[0])?' pic':'')+'" data-side="L" data-k="'+k+'">'+rich(p[0])+'</div>'; }).join('')+
    '</div><div class="col">'+st.order.map(function(k){ return '<div role="button" tabindex="0" class="mi rich'+(isPic(pairs[k][1])?' pic':'')+'" data-side="R" data-k="'+k+'">'+rich(pairs[k][1])+'</div>'; }).join('')+'</div></div>'+
    '<div class="muted small" style="margin-top:10px" id="mst'+i+'"></div>';
  function check(){
    if(st.selL==null||st.selR==null) return;
    var L=$('.mi[data-side=L][data-k="'+st.selL+'"]',el), R=$('.mi[data-side=R][data-k="'+st.selR+'"]',el);
    if(st.selL===st.selR){
      st.matched[st.selL]=1; L.classList.remove('sel'); R.classList.remove('sel'); L.classList.add('done'); R.classList.add('done');
    } else {
      st.mistakes[st.selL]=1; [L,R].forEach(function(x){ x.classList.remove('sel'); x.classList.add('wrong'); setTimeout(function(){ x.classList.remove('wrong'); },400); });
    }
    st.selL=st.selR=null;
    var m=Object.keys(st.matched).length;
    var correct=Object.keys(st.matched).filter(function(k){ return !st.mistakes[k]; }).length;
    W.answers[i]={correct:correct,total:n,done:m===n};
    $('#mst'+i).innerHTML = m===n ? '<span class="chip ok">🎉 Xong! Đúng ngay lần đầu '+correct+'/'+n+'</span>' : 'Đã nối '+m+'/'+n;
    updateProgress();
  }
  $$('.mi',el).forEach(function(b){ b.onclick=function(){
    var k=+b.dataset.k, side=b.dataset.side;
    if(st.matched[k]) return;
    $$('.mi[data-side='+side+']',el).forEach(function(x){ if(!x.classList.contains('done')) x.classList.remove('sel'); });
    b.classList.add('sel');
    if(side==='L') st.selL=k; else st.selR=k;
    check();
  }; });
}

/* Kéo thả điền từ */
function mountFill(act,i,el){
  var bank=act.bank.slice();
  var st = W.ui[i] = { used:{}, slot:act.items.map(function(it){ var a=[]; for(var b=0;b<it.blanks;b++) a.push(null); return a; }), active:null };
  function sync(){
    W.answers[i]=st.slot.map(function(r){ return r.map(function(x){ return x==null?'':bank[x]; }); });
    updateProgress();
  }
  function render(){
    el.innerHTML = '<p class="instr">Tap (or drag) a word to fill each gap. Tap a filled gap to remove it.<br><i>Chạm (hoặc kéo thả) từ bên dưới để điền vào chỗ trống. Chạm vào chỗ đã điền để bỏ ra.</i></p>'+
      '<div class="fillw '+(function(){ var mx=0; bank.forEach(function(w){ mx=Math.max(mx,String(w).length); }); return mx<=3?'tiny':mx<=6?'short':''; })()+'">'+act.items.map(function(it,k){
        var h='<div class="sent rich">'+(k+1)+'. ';
        it.parts.forEach(function(p,b){
          h+=rich(p);
          if(b<it.blanks){
            var v=st.slot[k][b]; var isAct=st.active&&st.active[0]===k&&st.active[1]===b;
            h+='<span class="blank '+(v==null?'empty':'filled')+(isAct?' act':'')+'" data-k="'+k+'" data-b="'+b+'">'+(v==null?'____':esc(bank[v]))+'</span>';
          }
        });
        return h+'</div>';
      }).join('')+'</div>'+
      '<div class="bank">'+bank.map(function(w,x){ return '<button class="wchip'+(st.used[x]?' used':'')+'" draggable="true" data-x="'+x+'">'+esc(w)+'</button>'; }).join('')+'</div>';
    $$('.blank',el).forEach(function(s){
      var k=+s.dataset.k,b=+s.dataset.b;
      s.onclick=function(){
        var v=st.slot[k][b];
        if(v!=null){ delete st.used[v]; st.slot[k][b]=null; st.active=[k,b]; }
        else st.active=[k,b];
        render(); sync();
      };
      s.ondragover=function(e){ e.preventDefault(); s.classList.add('over'); };
      s.ondragleave=function(){ s.classList.remove('over'); };
      s.ondrop=function(e){ e.preventDefault(); var x=+e.dataTransfer.getData('text/plain'); place(x,k,b); };
    });
    $$('.wchip',el).forEach(function(c){
      var x=+c.dataset.x;
      c.ondragstart=function(e){ e.dataTransfer.setData('text/plain',String(x)); };
      c.onclick=function(){
        var t=st.active;
        if(!t||st.slot[t[0]][t[1]]!=null){ t=null; for(var k=0;k<st.slot.length&&!t;k++) for(var b=0;b<st.slot[k].length;b++) if(st.slot[k][b]==null){ t=[k,b]; break; } }
        if(t) place(x,t[0],t[1]);
      };
    });
  }
  function place(x,k,b){
    if(st.used[x]) return;
    var old=st.slot[k][b]; if(old!=null) delete st.used[old];
    st.slot[k][b]=x; st.used[x]=1;
    // tự chuyển tới ô trống kế tiếp
    st.active=null;
    outer: for(var kk=0;kk<st.slot.length;kk++) for(var bb=0;bb<st.slot[kk].length;bb++) if(st.slot[kk][bb]==null){ st.active=[kk,bb]; break outer; }
    render(); sync();
  }
  render(); sync();
}

/* Chữ bay */
var GAMES=[];
function stopAllGames(){ GAMES.forEach(function(g){ g.stop=true; }); GAMES=[]; }
function mountFlying(act,i,el){
  var pairs=act.pairs, n=pairs.length;
  W.answers[i]={correct:0,total:n,done:false};
  var BCOL=['#F0604D','#2F7BE0','#169F68','#E79A16','#7B57E0','#B4447A'], COLORS_C=COLORS;
  el.innerHTML='<p class="instr">Listen and pop the right balloon!<br><i>Nghe và chạm vào bóng bay đúng nhé!</i></p><div class="sky" id="sky'+i+'"><div class="center"><div><div style="font-size:48px">🎈</div><button class="btn lg" id="go'+i+'">Bắt đầu</button><div class="muted small" style="margin-top:8px">'+n+' từ</div></div></div></div>';
  $('#go'+i).onclick=start;
  function start(){
    var sky=$('#sky'+i); var g={stop:false}; GAMES.push(g);
    var order=shuffle(pairs.map(function(_,k){return k;})), round=0, correct=0, missed=false, bubs=[];
    sky.innerHTML='<div class="prompt"></div><div class="hud"></div>';
    var prompt=$('.prompt',sky), hud=$('.hud',sky);
    function newRound(){
      bubs.forEach(function(b){ b.el.remove(); }); bubs=[]; missed=false;
      if(round>=n){ finish(); return; }
      var k=order[round];
      prompt.innerHTML=(/\[🔊/.test(pairs[k][0])?'':'Find / Tìm: ')+rich(pairs[k][0]);
      var sm=String(pairs[k][0]).match(/\[🔊\s*([^\]]+)\]/); if(sm) setTimeout(function(){ speak(sm[1]); },250);
      hud.textContent='Câu '+(round+1)+'/'+n+' · Đúng '+correct;
      var others=shuffle(pairs.map(function(_,x){return x;}).filter(function(x){ return x!==k && pairs[x][1]!==pairs[k][1]; })).slice(0,3);
      var words=shuffle([k].concat(others));
      var W2=sky.clientWidth, H=sky.clientHeight, lanes=words.length;
      words.forEach(function(x,idx){
        var b=document.createElement('div'); var wv=String(pairs[x][1]), cm=wv.match(/^color:([a-z]+)$/);
        b.className='bub'+(isPic(wv)&&!cm?' pic':'');
        if(cm){ b.innerHTML='&nbsp;&nbsp;&nbsp;&nbsp;'; b.style.background=COLORS_C[cm[1]]||cm[1]; if(cm[1]==='white') b.style.border='2px solid #ccc'; b.style.width='64px'; b.style.height='64px'; }
        else { b.innerHTML=rich(wv); b.style.background=BCOL[(x+round)%BCOL.length]; }
        sky.appendChild(b);
        var bw=b.offsetWidth;
        var laneW=W2/lanes; var left=Math.max(4,Math.min(W2-bw-4, laneW*idx+(laneW-bw)/2 + (Math.random()*20-10)));
        var o={el:b,x:left,y:H+20+Math.random()*120,v:(H/(5.5+Math.random()*2.5)),right:x===k};
        b.style.left=left+'px'; b.style.transform='translateY('+o.y+'px)';
        b.onpointerdown=function(e){ e.preventDefault(); hit(o); };
        bubs.push(o);
      });
    }
    function hit(o){
      if(o.gone) return;
      if(o.right){
        o.gone=true; o.el.classList.add('pop'); if(!missed) correct++;
        round++; setTimeout(newRound,320);
      } else {
        missed=true; o.el.classList.remove('no'); void o.el.offsetWidth; o.el.classList.add('no');
      }
    }
    var last=performance.now();
    function loop(t){
      if(g.stop||!sky.isConnected) return;
      var dt=Math.min(.05,(t-last)/1000); last=t;
      var H=sky.clientHeight, allOut=bubs.length>0;
      bubs.forEach(function(o){
        if(o.gone) return;
        o.y-=o.v*dt; o.el.style.transform='translateY('+o.y+'px)';
        if(o.y>-60) allOut=false;
      });
      if(allOut){ bubs.forEach(function(o){ o.y=H+20+Math.random()*120; }); }
      requestAnimationFrame(loop);
    }
    function finish(){
      g.stop=true;
      W.answers[i]={correct:correct,total:n,done:true}; updateProgress();
      var stars=correct/n>=.9?'⭐⭐⭐':correct/n>=.6?'⭐⭐':'⭐';
      sky.innerHTML='<div class="center"><div><div class="stars" style="font-size:34px">'+stars+'</div><div style="font-weight:800;font-size:22px">Đúng '+correct+'/'+n+'</div><button class="btn ghost sm" style="margin-top:10px" id="go'+i+'">Chơi lại</button></div></div>';
      $('#go'+i).onclick=start;
    }
    newRound(); requestAnimationFrame(function(t){ last=t; loop(t); });
  }
}

function isAndroid(){ return /Android/i.test(navigator.userAgent||''); }
function newRecorder(stream){
  var mime=pickMime();
  if(mime){ try{ return new MediaRecorder(stream,{mimeType:mime}); }catch(e){} }
  return new MediaRecorder(stream);
}
function pickMime(){
  if(!window.MediaRecorder) return '';
  var c=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'];
  for(var j=0;j<c.length;j++) if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c[j])) return c[j];
  return '';
}

/* Nộp ảnh (chụp màn hình) – ảnh được thu nhỏ trước khi gửi */
function shrinkImage(file){
  return new Promise(function(resolve){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var max=1600, w=img.naturalWidth, h=img.naturalHeight;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      var c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(function(b){ resolve(b||file); },'image/jpeg',0.78);
    };
    img.onerror=function(){ resolve(file); };
    img.src=url;
  });
}

var NC_W_VOCAB=0.2, NC_SCORE=[0,1,0.7,0.4], NC_AUDIO={}, NCS=null;
var NC_ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'],

  metre:'meter',metres:'meters',grey:'gray',mum:'mom',ok:'okay',programme:'program',neighbour:'neighbor',realise:'realize',organise:'organize',practise:'practice',vapour:'vapor',fertiliser:'fertilizer',racket:'racquet'};
/* Tách câu thành các "từ hiển thị", mỗi từ có thể gồm nhiều token (viết tắt được mở ra, số đổi thành chữ) */
function ncUnits(s){
  s=String(s||'').replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\bcan not\b/gi,'cannot');
  return s.split(/\s+/).filter(Boolean).map(function(w){
    var t=w.toLowerCase().replace(/\$\s?(\d+(?:\.\d+)?)/g,'$1 dollars').replace(/(\d)%/g,'$1 percent').replace(/%/g,' percent').replace(/(\d),(\d{3})/g,'$1$2').replace(/[-–—\/]/g,' ');
    t=t.replace(/(\d+)(st|nd|rd|th)\b/g,'$1').replace(/\d+/g,function(d){ return ' '+ncNum(d)+' '; });
    t=t.replace(/[a-z]+'[a-z]+/g,function(x){ return NC_CONTR[x]||x; }).replace(/[^a-z0-9' ]+/g,' ');
    var toks=t.split(/\s+/).map(function(x){ x=x.replace(/^'+|'+$/g,''); if(/'s$/.test(x)) x=x; return NC_SPELL[x]||x; }).filter(Boolean);
    return {w:w,t:toks};
  }).filter(function(u){ return u.t.length; });
}
function ncCompare(given, target){
  var G=ncUnits(given), T=ncUnits(target), gs=[], go=[], ts=[];
  G.forEach(function(u,k){ u.t.forEach(function(x){ gs.push(x); go.push(k); }); });
  T.forEach(function(u){ u.t.forEach(function(x){ ts.push(x); }); });
  var n=ts.length, m=gs.length, dp=[], i, j;
  for(i=0;i<=n;i++){ dp.push(new Array(m+1).fill(0)); }
  for(i=n-1;i>=0;i--) for(j=m-1;j>=0;j--) dp[i][j]= ts[i]===gs[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  var gOk=new Array(m).fill(false), missAfter={}, miss=0; i=0; j=0;
  while(i<n && j<m){
    if(ts[i]===gs[j]){ gOk[j]=true; i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ var at=j-1<0?-1:go[j-1]; missAfter[at]=(missAfter[at]||0)+1; miss++; i++; }
    else j++;
  }
  while(i<n){ var at2=m?go[m-1]:-1; missAfter[at2]=(missAfter[at2]||0)+1; miss++; i++; }
  var bad=G.map(function(){ return false; }); gs.forEach(function(_,q){ if(!gOk[q]) bad[go[q]]=true; });
  var match=dp[0][0], ok=match===n && match===m && n>0;
  var html=(missAfter[-1]?'<span class="gap">＿</span> ':'')+G.map(function(u,k){
    return '<span class="w'+(bad[k]?' x':'')+'">'+esc(u.w)+'</span>'+(missAfter[k]?' <span class="gap">'+new Array(missAfter[k]+1).join('＿ ')+'</span>':'');
  }).join(' ');
  var wrong=bad.filter(Boolean).length;
  return {ok:ok, acc:Math.max(n,m)?match/Math.max(n,m):0, html:html||'<span class="muted">(trống)</span>', wrong:wrong, miss:miss};
}
function ncViPlain(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/\(.*?\)/g,' ').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim(); }
function ncViOk(given, vi){
  var g=ncViPlain(given); if(!g) return false;
  var vars=String(vi).split(/[,;\/]|\bhoặc\b/).map(ncViPlain).filter(Boolean); vars.push(ncViPlain(vi));
  var gt=g.split(' ');
  return vars.some(function(v){
    if(g===v) return true;
    var vt=v.split(' ').filter(function(t){ return ['nhung','cac','mot','cai','con','su','viec','duoc','bi','la'].indexOf(t)<0; }); if(!vt.length) vt=v.split(' ');
    var hit=vt.filter(function(t){ return gt.indexOf(t)>=0; }).length;
    return hit>=1 && hit/vt.length>=0.6 && gt.length<=v.split(' ').length*2+2;
  });
}
function ncEnKey(s){
  return ncUnits(String(s||'').replace(/\(.*?\)/g,' ').replace(/…|\.\.\.|\?/g,' ')).map(function(u){ return u.t.join(' '); }).join(' ')
    .split(' ').filter(function(t){ return ['sth','something','sb','someone','somebody'].indexOf(t)<0; }).join(' ').replace(/^(a|an|the) /,'');
}
function ncEnOk(given, en){
  var g=ncEnKey(given); if(!g) return false;

}

      return '<div class="ncq" id="ncq'+q+'"><div class="ncrow">'+(Q.e2?'<button class="ncspk" data-sp="'+Q.v+'">🔊</button><b>'+esc(V[Q.v].en)+'</b> <span class="muted small">nghĩa là gì?</span>':'<b>'+esc(V[Q.v].vi)+'</b> <span class="muted small">tiếng Anh là gì?</span>')+'</div>'+
        '<div class="ncopts">'+Q.opts.map(function(o){ return '<button data-q="'+q+'" data-o="'+o+'">'+esc(Q.e2?V[o].vi:V[o].en)+'</button>'; }).join('')+'</div></div>'; }).join('')+'</div>';

function ncStop(){ if(NCS&&NCS.au){ try{ NCS.au.pause(); }catch(e){} } if(NCS) clearInterval(NCS.auT); var p=$('#ncplay'); if(p){ p.classList.remove('playing'); p.textContent='▶'; } }
function ncPlay(){
  var S=NCS.L.sents[NCS.s]; if(!S) return;
  var btn=$('#ncplay');
  ncLoadAudio(NCS.L.n).then(function(url){
    if(!NCS) return;
    if(!NCS.au){ NCS.au=new Audio(); NCS.au.setAttribute('playsinline',''); NCS.au.preload='auto'; }
    var au=NCS.au;
    var start=function(){
      ncStop(); au.playbackRate=NCS.rate; au.currentTime=S.s;
      var p=au.play(); if(p&&p.catch) p.catch(function(){ toast('Chưa phát được âm thanh, con bấm ▶ lần nữa nhé.'); });
      if(btn){ btn.classList.add('playing'); btn.textContent='⏸'; }
      NCS.auT=setInterval(function(){ if(au.currentTime>=S.e||au.ended){ ncStop(); } },40);
    };
    if(au.src!==url){ au.src=url; au.onloadedmetadata=function(){ au.onloadedmetadata=null; start(); }; au.load(); } else start();
  }).catch(function(e){ toast((e&&e.message)||'Chưa tải được file nghe.'); });
}

    '<textarea class="ncta" id="ncin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Nghe rồi gõ lại cả câu vào đây…"></textarea>'+

function ncCheck(){
  var S=NCS.L.sents[NCS.s], ta=$('#ncin'), g=ta.value;
  if(!g.trim()){ toast('Con nghe rồi gõ câu vào ô nhé'); return; }
  NCS.tries++;
  var r=ncCompare(g,S.en), fb=$('#ncfb');
  if(r.ok){
    NCS.res[NCS.s]={t:NCS.tries,sc:NC_SCORE[NCS.tries]};
    fb.innerHTML='<div class="ncdiff">'+r.html+'</div><div class="ncmsg ok">'+(NCS.tries===1?'🎉 Chính xác ngay lần đầu!':'✔ Đúng rồi! (lần '+NCS.tries+')')+'</div><div class="ncmsg vi">🇻🇳 '+esc(S.vi)+'</div>';
    ta.disabled=true; ncNextBtn();
    return;
  }
  var cnt=r.wrong+r.miss;
  if(NCS.tries===1){
    fb.innerHTML='<div class="ncdiff">'+r.html+'</div><div class="ncmsg bad">Còn '+cnt+' chỗ chưa đúng (tô đỏ, ＿ là thiếu từ). Con nghe lại và sửa nhé – lần 2.</div>';
  } else if(NCS.tries===2){
    fb.innerHTML='<div class="ncdiff">'+r.html+'</div><div class="ncmsg bad">Vẫn còn '+cnt+' chỗ chưa đúng. Gợi ý nghĩa của câu ở dưới – lần 3.</div><div class="ncmsg vi">🇻🇳 '+esc(S.vi)+'</div>';
  } else {
    NCS.res[NCS.s]={t:0,sc:Math.round(0.3*r.acc*100)/100};
    fb.innerHTML='<div class="ncdiff">'+r.html+'</div><div class="ncmsg ans">📌 Đáp án: <b>'+esc(S.en)+'</b></div><div class="ncmsg vi">🇻🇳 '+esc(S.vi)+'</div>';
    ta.disabled=true; ncNextBtn(); return;
  }
  ncSaveState();
  setTimeout(function(){ try{ ta.focus({preventScroll:true}); }catch(e){} },50);
}

function ncResult(){

/* Lưu ngay kết quả phần nghe (không cần bấm Nộp bài) nếu các phần khác trong bài đều làm trên web khác */
function ncAutoSave(i){
  if(!S.student||S.student.id==='preview'){ toast('Bản xem thử: đạt '+W.answers[i].pct+'%'); return; }
  var others=W.a.activities.some(function(act,k){ return k!==i && !isExt(act) && act.type!=='dict' && !isDone(k); });
  if(others){ toast('Phần nghe đạt '+W.answers[i].pct+'%. Con làm nốt các phần khác rồi bấm Nộp bài nhé.'); return; }
  var ans=W.answers.map(function(x,k){ var t=W.a.activities[k].type; return t==='dict'&&!(x&&x.done)?null:x; });
  api('api_submit',{assignmentId:W.a.id,studentId:S.student.id,answers:ans,audios:[],linksDone:W.linksDone,partsDone:partsDoneLocal(),durationSec:Math.round((Date.now()-(W.t0||Date.now()))/1000)})
    .then(function(res){ W.prev={submittedAt:new Date().toISOString(),attempts:res.attempts||1,actScores:res.actScores||null}; toast('✅ Đã lưu kết quả phần nghe: '+W.answers[i].pct+'%'); api('api_getStudentHome',S.student.id).then(function(h){ S.home=h; }); })
    .catch(function(e){ toast('Chưa lưu được, con bấm Nộp bài nhé. ('+((e&&e.message)||e)+')'); });
}

function blobToB64(blob){
  return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(String(r.result).split(',')[1]||''); }; r.onerror=rej; r.readAsDataURL(blob); });
}
function trySubmit(){
  var missing=[];
  W.a.activities.forEach(function(act,i){ if(!isDone(i)) missing.push(i+1); });
  if(W.a.activities.length && W.a.activities.every(isExt) && !W.a.links.length && !missing.length){ toast('Con đã làm xong hết rồi, không cần nộp thêm 🎉'); }
  var p = missing.length ? modal('<h3>Con chưa làm xong</h3><p>Phần '+missing.join(', ')+' chưa hoàn thành. Con có muốn nộp luôn không?</p>',[{label:'Làm tiếp',cls:'plain',value:false},{label:'Vẫn nộp',value:true}]) : Promise.resolve(true);
  p.then(function(go){ if(go) doSubmit(); });
}
function doSubmit(){
  var btn=$('#submit'); btn.disabled=true; btn.textContent=Object.keys(W.rec).length?'Đang nộp & AI chấm…':'Đang nộp…';
  var audios=[], jobs=[];
  Object.keys(W.rec).forEach(function(key){
    var p=key.split('_'), r=W.rec[key];
    var isImg=/^image\//.test(r.mime||'');
    jobs.push((isImg?Promise.resolve(null):toWav(r.blob)).then(function(w){ var b=w||r.blob, mime=w?'audio/wav':(r.mime||'audio/webm').split(';')[0];
      return blobToB64(b).then(function(b64){ audios.push({act:+p[0],item:+p[1],mime:mime,data:b64}); }); }));
  });
  Promise.all(jobs).then(function(){
    return api('api_submit',{assignmentId:W.a.id,studentId:S.student.id,answers:W.answers,audios:audios,linksDone:W.linksDone,partsDone:partsDoneLocal(),durationSec:Math.round((Date.now()-(W.t0||Date.now()))/1000)});
  }).then(function(res){
    stopAllGames();
    W.a.activities.forEach(function(act,i){ if(act.type==='writing') store('hw_draft_'+W.a.id+'_'+i,null); });
    clearWorkDraft(W.a.id);

  }).catch(function(e){
    btn.disabled=false; btn.textContent='Nộp bài';

    modal('<h3>Chưa nộp được</h3><p>'+esc(e.message||e)+'</p><p class="muted small">Kiểm tra mạng rồi bấm Nộp bài lần nữa nhé.</p>',[{label:'Đóng'}]);

function rawFrom(x){
  if(x.type==='mcq') return x.items.map(function(it){ return [it.q].concat(it.options.map(function(o,j){ return (j===it.answer?'*':'')+o; })).join(' | '); }).join('\n');
  if(x.type==='match'||x.type==='flying') return x.pairs.map(function(p){ return p[0]+' = '+p[1]; }).join('\n');
  if(x.type==='fill') return x.items.map(function(it){ return it.text; }).join('\n')+(x.extra&&x.extra.length?'\nThêm: '+x.extra.join(', '):'');
  if(x.type==='speaking') return x.items.map(function(it){ return it.q; }).join('\n')+(x.maxSec?'\nTối đa: '+x.maxSec:'');
  if(x.type==='say') return x.items.map(function(it){ return (it.target.length===1&&it.target[0]===it.ask)?it.ask:it.ask+' => '+it.target.join(' / '); }).join('\n');
  if(x.type==='order') return x.items.map(function(it){ return it.vi+' => '+it.en+((it.extra||[]).length?' | thêm: '+it.extra.join(', '):''); }).join('\n');
  if(x.type==='typein') return x.items.map(function(it){ return it.q+' => '+(it.answers||[]).join(' / '); }).join('\n');
  if(x.type==='writing') return x.prompt+(x.minWords?'\nTối thiểu: '+x.minWords:'');
  if(x.type==='photo') return x.items.map(function(it){ return it.q; }).join('\n');
  if(x.type==='ext99'||x.type==='extee'||x.type==='extlr'||x.type==='dict') return (x.items||[]).map(function(it){ return it.ref; }).join('\n');
  return '';
}
function lines(raw){ return String(raw||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean); }
function parseBlock(b){
  var L=lines(b.raw), out={type:b.type,title:b.title.trim(),raw:b.raw}, errs=[];
  if(b.points!==undefined && String(b.points).trim()!==''){ var pv=Number(String(b.points).replace(',','.')); if(isNaN(pv)||pv<0) errs.push('Điểm phần này chưa đúng'); else out.points=pv; }
  if(b.type==='mcq'){
    out.items=L.map(function(l,n){
      var p=l.split('|').map(function(s){ return s.trim(); }); var q=p.shift(); var ans=-1;
      var opts=p.filter(Boolean).map(function(o,j){ if(o.charAt(0)==='*'){ ans=j; return o.slice(1).trim(); } return o; });
      if(opts.length<2) errs.push('Dòng '+(n+1)+': cần ít nhất 2 đáp án, cách nhau bằng |');
      else if(ans<0) errs.push('Dòng '+(n+1)+': chưa đánh dấu * cho đáp án đúng');
      return {q:q,options:opts,answer:ans};
    });
  } else if(b.type==='match'||b.type==='flying'){
    out.pairs=L.map(function(l,n){ var k=l.indexOf('='); if(k<0){ errs.push('Dòng '+(n+1)+': thiếu dấu ='); return [l,'']; } return [l.slice(0,k).trim(), l.slice(k+1).trim()]; });
    if(out.pairs.length<2) errs.push('Cần ít nhất 2 cặp');
  } else if(b.type==='fill'){
    out.extra=[]; out.items=[];
    L.forEach(function(l,n){
      var m=l.match(/^(thêm|them|extra)\s*:\s*(.*)$/i);
      if(m){ out.extra=m[2].split(',').map(function(s){ return s.trim(); }).filter(Boolean); return; }
      if(!/\*[^*]+\*/.test(l)) errs.push('Dòng '+(n+1)+': chưa có *từ cần điền*');
      out.items.push({text:l});
    });
  } else if(b.type==='say'){
    out.items=L.map(function(l){
      var k=l.indexOf('=>');
      if(k<0) return {ask:l, target:[l]};
      return {ask:l.slice(0,k).trim(), target:l.slice(k+2).split(' / ').map(function(x){ return x.trim(); }).filter(Boolean)};
    });
  } else if(b.type==='order'){
    out.items=L.map(function(l,n){
      var k=l.indexOf('=>'); if(k<0){ errs.push('Dòng '+(n+1)+': thiếu "=>"'); return {vi:l,en:'',extra:[]}; }
      var rest=l.slice(k+2), m=rest.match(/\|\s*(thêm|them|extra)\s*:\s*(.*)$/i);
      var en=(m?rest.slice(0,m.index):rest).trim();
      return {vi:l.slice(0,k).trim(), en:en, extra:m?m[2].split(',').map(function(x){ return x.trim(); }).filter(Boolean):[]};
    });
  } else if(b.type==='typein'){
    out.items=L.map(function(l,n){
      var k=l.lastIndexOf('=>');
      if(k<0){ errs.push('Dòng '+(n+1)+': thiếu "=>" và đáp án'); return {q:l,answers:[]}; }
      return {q:l.slice(0,k).trim(), answers:l.slice(k+2).split(' / ').map(function(x){ return x.trim(); }).filter(Boolean)};
    });
  } else if(b.type==='speaking'){
    out.items=[]; out.maxSec=120;
    L.forEach(function(l){ var m=l.match(/^(tối đa|toi da|max)\s*:\s*(\d+)/i); if(m) out.maxSec=+m[2]; else out.items.push({q:l}); });
  } else if(b.type==='photo'){
    out.items=L.map(function(l){ return {q:l}; });
  } else if(b.type==='ext99'){
    out.items=L.map(function(l,n){ if(/\d\D+\d/.test(l)){ var r=padSet(l); return {ref:r}; } var x=parseInt(String(l).replace(/[^0-9]/g,''),10); if(!(x>=1&&x<=99)) errs.push('Dòng '+(n+1)+': ghi số cấu trúc 1–99, vd 21'); return {ref:String(x||'')}; });
  } else if(b.type==='dict'){
    var dn=parseInt(String(L[0]||'').replace(/[^0-9]/g,''),10);
    if(!(dn>=1&&dn<=40)) errs.push('Ghi số bài nghe 1–40, vd 12');
    if(L.length>1) errs.push('Mỗi phần chỉ 1 bài nghe (thêm phần mới nếu muốn giao 2 bài)');
    out.items=[{ref:String(dn||'')}];
  } else if(b.type==='extlr'){
    out.items=L.map(function(l,n){ var r=lrRef(l); if(!r||!TLR[r]) errs.push('Dòng '+(n+1)+': ghi buổi L1–L18 hoặc R1–R27, vd L8'); return {ref:r}; });
  } else if(b.type==='extee'){
    out.items=L.map(function(l,n){ var r=String(l).replace(/[^0-9]/g,''); if(!r) errs.push('Dòng '+(n+1)+': ghi số bài, vd 21'); return {ref:r}; });
  } else if(b.type==='writing'){
    var txt=String(b.raw||'').trim(), m=txt.match(/\n?\s*(tối thiểu|toi thieu|min)\s*:\s*(\d+)\s*$/i);
    out.minWords=m?+m[2]:0; out.prompt=m?txt.slice(0,m.index).trim():txt;
  }
  if(!L.length) errs.push('Chưa có nội dung');
  var count = out.items?out.items.length:out.pairs?out.pairs.length:1;
  return {act:out,errs:errs,count:count};
}

/* Đã làm bao nhiêu phần: phần trong app (lúc nộp) + nhiệm vụ trên web khác */
